<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO LAB v4.0.6</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}main{max-width:520px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.ver{background:#294664;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.card{margin-top:10px;background:#fff;border:1px solid #c8d5e2;border-radius:18px;padding:12px}.stage{min-height:455px;display:grid;place-items:center;background:linear-gradient(#f7fbff,#edf5fb);border-radius:15px;position:relative;overflow:hidden}.status{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;background:#fff;padding:6px 9px;border-radius:999px;z-index:3}.checker{background-color:#eef4fb;background-image:linear-gradient(45deg,#dce8f3 25%,transparent 25%),linear-gradient(-45deg,#dce8f3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dce8f3 75%),linear-gradient(-45deg,transparent 75%,#dce8f3 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}canvas{width:min(96%,390px);height:auto;filter:drop-shadow(0 12px 14px rgba(41,70,100,.15))}.row{padding:9px 0}.label{font-weight:900;margin-bottom:6px}.opts{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #aab9ca;background:#fff;border-radius:999px;padding:7px 10px;font-weight:800;color:#233a58}button.on{background:#31587f;color:#fff;border-color:#31587f}.small{font-size:11px;color:#5a6c7f;line-height:1.55}.ok{color:#25784b;font-weight:900}.sel{padding:10px;border-radius:14px;background:#f5f9fd;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{padding:8px;border:1px solid #d8e2ec;border-radius:12px;background:#fff}.mini b{display:block;font-size:12px;margin-bottom:4px}.muted{opacity:.55}</style></head><body><main><div class="top"><div><b>☆ STAR ATHLETES</b><div>DRACO PARTS LAB</div></div><div class="ver">v4.0.6</div></div><section class="card"><div class="stage checker"><div id="st" class="status">Canvas素材読込中…</div><canvas id="cv" width="420" height="500"></canvas></div></section><section class="card"><div class="row"><div class="label">合成パーツ</div><div class="opts" id="cats"><button class="on" data-cat="horn">角</button><button data-cat="wing">羽</button><button data-cat="tail">しっぽ</button><button data-cat="pattern">模様</button><button data-cat="accessory">アクセ</button></div></div><div class="row"><div class="opts" id="variants"></div></div><div class="sel"><b id="current">horn : normal</b><div class="small">基準ドラコの上に、選択した透過clean素材を固定アンカーでCanvas合成しています。</div></div><div class="row"><div class="label">アンカー状態</div><div class="grid" id="anchorInfo"></div></div><div class="small"><span class="ok">v4.0.6:</span> 位置合わせ用の合成パイロット。基準ドラコには既存の角・羽・しっぽが残っているため、これは最終差し替えではなくアンカー検証です。次段階でニュートラルベースへ移行します。</div></section></main><script>const G='../star-athletes-draco-lab/generated/';const REV='406';const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),st=document.getElementById('st'),variants=document.getElementById('variants'),current=document.getElementById('current'),anchorInfo=document.getElementById('anchorInfo');const defs={horn:[['normal','ノーマル'],['curl','コール'],['crystal','クリスタル']],wing:[['normal','ノーマル'],['feather','フェザー'],['crystal','クリスタル']],tail:[['normal','ノーマル'],['star','スター'],['leaf','リーフ']],pattern:[['star','スター'],['moon','ムーン'],['line','ライン']],accessory:[['ribbon','リボン'],['scarf','スカーフ'],['flower','花飾り']]};const anchors={horn:{x:.50,y:.12,w:.27},wing:{x:.21,y:.42,w:.33},tail:{x:.12,y:.66,w:.30},pattern:{x:.46,y:.66,w:.22},accessory:{x:.54,y:.53,w:.26}};let cat='horn',val='normal',base=null,overlay=null;function url(c,v){return G+c+'_'+v+'_clean.png?v='+REV}function load(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(Error(src));im.src=src})}function fitDraw(im){const maxW=370,maxH=440;const s=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight);const w=im.naturalWidth*s,h=im.naturalHeight*s,x=(420-w)/2,y=(500-h)/2+8;ctx.drawImage(im,x,y,w,h);return{x,y,w,h}}function render(){ctx.clearRect(0,0,420,500);if(!base)return;const b=fitDraw(base);if(overlay){const a=anchors[cat],dw=b.w*a.w,dh=overlay.naturalHeight*(dw/overlay.naturalWidth);const x=b.x+b.w*a.x-dw/2,y=b.y+b.h*a.y-dh/2;ctx.drawImage(overlay,x,y,dw,dh);}}function renderVars(){variants.innerHTML='';for(const [v,label] of defs[cat]){const b=document.createElement('button');b.textContent=label;b.className=v===val?'on':'';b.onclick=()=>setPart(cat,v);variants.appendChild(b)}}function renderAnchorInfo(){anchorInfo.innerHTML='';for(const [k,a] of Object.entries(anchors)){const d=document.createElement('div');d.className='mini'+(k===cat?'':' muted');d.innerHTML='<b>'+k+'</b><span class="small">x '+a.x.toFixed(2)+' / y '+a.y.toFixed(2)+' / 幅 '+a.w.toFixed(2)+'</span>';anchorInfo.appendChild(d)}}async function setPart(c,v){cat=c;val=v;document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat));renderVars();renderAnchorInfo();current.textContent=cat+' : '+val;try{overlay=await load(url(cat,val));render()}catch(e){st.textContent='パーツ読込失敗: '+cat+'/'+val}}document.getElementById('cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;setPart(b.dataset.cat,defs[b.dataset.cat][0][0])};(async()=>{try{base=await load(G+'body_base_clean.png?v=405c');st.textContent='Canvas base OK '+base.naturalWidth+'×'+base.naturalHeight+' / 406';render();await setPart('horn','normal')}catch(e){st.textContent='読込失敗'}})();</script></body></html>
