<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO LAB v4.1.1</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}main{max-width:520px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.ver{background:#294664;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.card{margin-top:10px;background:#fff;border:1px solid #c8d5e2;border-radius:18px;padding:12px}.stage{min-height:455px;display:grid;place-items:center;background:#f4f9fd;border-radius:15px;position:relative;overflow:hidden}.status{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;background:#fff;padding:6px 9px;border-radius:999px;z-index:3}canvas{width:min(96%,390px);height:auto}.opts{display:flex;gap:6px;flex-wrap:wrap}.row{padding:9px 0}.label{font-weight:900;margin-bottom:6px}button{border:1px solid #aab9ca;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;color:#233a58}button.on{background:#31587f;color:#fff}.small{font-size:11px;color:#5a6c7f;line-height:1.55}.ok{color:#25784b;font-weight:900}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.m{padding:8px;border-radius:10px;background:#f5f9fd;font-size:11px}.ctrl{display:grid;grid-template-columns:72px 1fr 52px;gap:8px;align-items:center;margin-top:10px}.ctrl input{width:100%}</style></head><body><main><div class="top"><div><b>☆ STAR ATHLETES</b><div>DRACO REFERENCE LAB</div></div><div class="ver">v4.1.1</div></div><section class="card"><div class="stage"><div id="st" class="status">左右基準レイヤー読込中…</div><canvas id="cv" width="545" height="515"></canvas></div></section><section class="card"><div class="row"><div class="label">基準パーツ（画面基準）</div><div class="opts" id="cats"><button class="on" data-cat="horn_left">左角</button><button data-cat="horn_right">右角</button><button data-cat="wing_left">左羽</button><button data-cat="wing_right">右羽</button><button data-cat="tail">しっぽ</button></div></div><div class="ctrl"><b>Opacity</b><input id="op" type="range" min="0" max="1" step="0.05" value="0.45"><span id="ov">0.45</span></div><div class="meta" id="meta"></div><div class="row small"><span class="ok">v4.1.1:</span> 角と羽を左右別スロットに分割。ここでの「左/右」は画面上の左右です。各reference patchは基準ドラコ本体から直接切り出して元座標へ戻しているため、標準状態はピクセル単位で一致します。次段階では1つの遺伝子variantを左右それぞれのアンカーへ変換して描画します。</div></section></main><script>const G='../star-athletes-draco-lab/generated/';const REV='411';const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),st=document.getElementById('st'),meta=document.getElementById('meta'),op=document.getElementById('op'),ov=document.getElementById('ov');let cat='horn_left',body=null,ref=null,info=null;function load(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}async function boot(){info=await fetch(G+'metadata.json?v='+REV).then(r=>r.json());body=await load(G+'body_stage.png?v='+REV);cv.width=info.body_stage.width;cv.height=info.body_stage.height;await select('horn_left');st.textContent='Bilateral exact references ready / '+REV}function render(){if(!body||!ref||!info)return;ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(body,0,0);const r=info.references[cat].rect;ctx.save();ctx.globalAlpha=+op.value;ctx.drawImage(ref,r[0],r[1]);ctx.restore();ctx.strokeStyle='rgba(38,92,136,.55)';ctx.setLineDash([6,5]);ctx.strokeRect(r[0]+.5,r[1]+.5,r[2]-r[0]-1,r[3]-r[1]-1)}function showMeta(){const a=info.references[cat].anchor,r=info.references[cat].rect;meta.innerHTML='<div class="m"><b>Rect</b><br>'+r.join(', ')+'</div><div class="m"><b>Anchor</b><br>x '+a.x.toFixed(4)+' / y '+a.y.toFixed(4)+'</div><div class="m"><b>Scale</b><br>'+a.scale.toFixed(4)+'</div><div class="m"><b>Transform</b><br>0° / no flip</div>'}async function select(c){cat=c;document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('on',b.dataset.cat===c));ref=await load(G+'ref_'+c+'.png?v='+REV);showMeta();render()}document.getElementById('cats').onclick=e=>{const b=e.target.closest('button');if(b)select(b.dataset.cat)};op.oninput=()=>{ov.textContent=(+op.value).toFixed(2);render()};boot().catch(()=>st.textContent='読込失敗')</script></body></html>
