<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO LAB v4.0.4</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}main{max-width:520px;margin:auto;padding:12px 12px 28px}.top{display:flex;justify-content:space-between;align-items:center}.top b{font-size:22px}.ver{background:#294664;color:#fff;border-radius:999px;padding:9px 13px}.card{margin-top:10px;background:#fff;border:1px solid #c8d5e2;border-radius:18px;padding:12px}.stage{min-height:420px;display:grid;place-items:center;background:#f4f9fd;border-radius:15px;position:relative;overflow:hidden}.status{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;background:#fff;padding:6px 9px;border-radius:999px;z-index:2}.err{color:#b13838}canvas{display:block;width:min(100%,360px);height:auto}.row{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f5}.row:last-child{border:0}.row b{font-size:12px}.opts{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #aab9ca;background:#fff;color:#233a58;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850}button.on{background:#31587f;color:#fff;border-color:#31587f}.preview{margin-top:10px;display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;background:#f7fbff;border-radius:14px;padding:10px}.preview img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:12px}.preview b{font-size:12px}.preview p{font-size:10px;line-height:1.5;color:#5a6c7f;margin:4px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{border-radius:12px;padding:11px}.note{font-size:11px;line-height:1.6;color:#5a6c7f}</style></head><body><main><div class="top"><div><b>☆ STAR ATHLETES</b><div>DRACO PARTS LAB</div></div><div class="ver">v4.0.4</div></div><section class="card"><div class="stage"><div id="st" class="status">生成PNG読込中…</div><canvas id="cv" width="360" height="430"></canvas></div><div class="preview"><img id="pv" alt="selected asset"><div><b id="pt">基準ドラコ</b><p id="pd">GitHub Actionsで生成した実画像を使用。旧base64アトラスは不使用。</p></div></div></section><section class="card"><div class="row"><b>表情</b><div class="opts" data-kind="face"><button class="on" data-file="face_normal.png">通常</button><button data-file="face_happy.png">うれしい</button><button data-file="face_fight.png">やる気</button><button data-file="face_sad.png">しょんぼり</button><button data-file="face_tired.png">つかれ</button></div></div><div class="row"><b>角</b><div class="opts" data-kind="horn"><button class="on" data-file="horn_normal.png">ノーマル</button><button data-file="horn_curl.png">カール</button><button data-file="horn_crystal.png">クリスタル</button></div></div><div class="row"><b>羽</b><div class="opts" data-kind="wing"><button class="on" data-file="wing_normal.png">ノーマル</button><button data-file="wing_feather.png">フェザー</button><button data-file="wing_crystal.png">クリスタル</button></div></div><div class="row"><b>しっぽ</b><div class="opts" data-kind="tail"><button class="on" data-file="tail_normal.png">ノーマル</button><button data-file="tail_star.png">スター</button><button data-file="tail_leaf.png">リーフ</button></div></div><div class="row"><b>模様</b><div class="opts" data-kind="pattern"><button class="on" data-file="pattern_star.png">スター</button><button data-file="pattern_moon.png">ムーン</button><button data-file="pattern_line.png">ライン</button></div></div><div class="row"><b>アクセ</b><div class="opts" data-kind="accessory"><button class="on" data-file="accessory_ribbon.png">リボン</button><button data-file="accessory_scarf.png">スカーフ</button><button data-file="accessory_flower.png">花飾り</button></div></div></section><div class="actions"><button id="base">基準ドラコ</button><button id="rand" class="on">↝ ランダム確認</button></div><section class="card"><div class="note">v4.0.4は、GitHub Actionsが生成した正常PNGを直接読み込む確認版。現在のマスターシートは「見本用パーツ一覧」なので、ここでは各パーツを正しく表示・選択できることを確認し、次段階で本当に重ねられる透過レイヤーへ変換してCanvas合成へ進みます。</div></section></main><script>const root='../star-athletes-draco-lab/generated/';const cv=document.getElementById('cv'),x=cv.getContext('2d'),st=document.getElementById('st'),pv=document.getElementById('pv'),pt=document.getElementById('pt'),pd=document.getElementById('pd');let body=null;function load(src){return new Promise((ok,no)=>{const im=new Image;im.onload=()=>ok(im);im.onerror=()=>no(Error(src+' decode'));im.src=root+src+'?v=404'})}function fit(img){x.clearRect(0,0,360,430);x.fillStyle='#f3f8fd';x.fillRect(0,0,360,430);const s=Math.min(330/img.naturalWidth,390/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;x.drawImage(img,(360-w)/2,(430-h)/2,w,h)}async function select(btn){const g=btn.closest('.opts');g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn));const file=btn.dataset.file;pv.src=root+file+'?v=404';pt.textContent=g.dataset.kind+'：'+btn.textContent;pd.textContent='生成済みPNG '+file+' を表示中。';}document.querySelectorAll('.opts').forEach(g=>g.onclick=e=>{if(e.target.dataset.file)select(e.target)});document.getElementById('base').onclick=()=>{if(body)fit(body);pv.src=root+'body_base.png?v=404';pt.textContent='基準ドラコ';pd.textContent='承認済みマスターシートからActionsで切り出した基準全身。'};document.getElementById('rand').onclick=()=>{const gs=[...document.querySelectorAll('.opts')];const g=gs[Math.floor(Math.random()*gs.length)],bs=[...g.querySelectorAll('button')],b=bs[Math.floor(Math.random()*bs.length)];select(b)};(async()=>{try{body=await load('body_base.png');fit(body);pv.src=root+'body_base.png?v=404';st.textContent='Generated PNG OK '+body.naturalWidth+'×'+body.naturalHeight}catch(e){st.classList.add('err');st.textContent='読込失敗: '+e.message}})();</script></body></html>
