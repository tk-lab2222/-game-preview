<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO LAB v4.0.5</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}main{max-width:520px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.ver{background:#294664;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.card{margin-top:10px;background:#fff;border:1px solid #c8d5e2;border-radius:18px;padding:12px}.stage{min-height:430px;display:grid;place-items:center;background:linear-gradient(#f7fbff,#edf5fb);border-radius:15px;position:relative;overflow:hidden}.status{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;background:#fff;padding:6px 9px;border-radius:999px;z-index:3}.checker{background-color:#eef4fb;background-image:linear-gradient(45deg,#dce8f3 25%,transparent 25%),linear-gradient(-45deg,#dce8f3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dce8f3 75%),linear-gradient(-45deg,transparent 75%,#dce8f3 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}.hero{width:min(92%,360px);height:390px;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(41,70,100,.16))}.row{padding:9px 0}.label{font-weight:900;margin-bottom:6px}.opts{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #aab9ca;background:#fff;border-radius:999px;padding:7px 10px;font-weight:800;color:#233a58}button.on{background:#31587f;color:#fff;border-color:#31587f}.preview{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin-top:8px;padding:10px;border-radius:14px;background:#f5f9fd}.partbox{height:105px;border-radius:12px;display:grid;place-items:center;overflow:hidden}.partbox img{max-width:96%;max-height:96%;object-fit:contain}.small{font-size:11px;color:#5a6c7f;line-height:1.55}.ok{color:#25784b;font-weight:900}</style></head><body><main><div class="top"><div><b>☆ STAR ATHLETES</b><div>DRACO PARTS LAB</div></div><div class="ver">v4.0.5</div></div><section class="card"><div class="stage checker"><div id="st" class="status">clean素材読込中…</div><img id="hero" class="hero" alt="Draco clean"></div></section><section class="card"><div class="row"><div class="label">パーツ確認</div><div class="opts" id="cats"><button class="on" data-cat="face" data-v="normal">表情</button><button data-cat="horn" data-v="normal">角</button><button data-cat="wing" data-v="normal">羽</button><button data-cat="tail" data-v="normal">しっぽ</button><button data-cat="pattern" data-v="star">模様</button><button data-cat="accessory" data-v="ribbon">アクセ</button></div></div><div class="row"><div class="opts" id="variants"></div></div><div class="preview"><div class="partbox checker"><img id="part"></div><div><b id="ptitle">face : normal</b><div class="small" id="pdesc">透過済みclean素材を表示中。</div></div></div><div class="small" style="margin-top:12px"><span class="ok">v4.0.5 / 405c:</span> 基準ドラコは安全マージン付きの広い切り出しで再生成。多少隣パネルに重なってもclean化で本体以外を除去し、右端欠けを防ぎます。</div></section></main><script>const G='../star-athletes-draco-lab/generated/';const REV='405c';const hero=document.getElementById('hero'),part=document.getElementById('part'),st=document.getElementById('st'),variants=document.getElementById('variants'),ptitle=document.getElementById('ptitle'),pdesc=document.getElementById('pdesc');const defs={face:[['normal','通常'],['happy','うれしい'],['fight','やる気'],['sad','しょんぼり'],['tired','つかれ']],horn:[['normal','ノーマル'],['curl','コール'],['crystal','クリスタル']],wing:[['normal','ノーマル'],['feather','フェザー'],['crystal','クリスタル']],tail:[['normal','ノーマル'],['star','スター'],['leaf','リーフ']],pattern:[['star','スター'],['moon','ムーン'],['line','ライン']],accessory:[['ribbon','リボン'],['scarf','スタースカーフ'],['flower','花飾り']]};let cat='face',val='normal';function src(c,v){return G+c+'_'+v+'_clean.png?v='+REV}function setPart(c,v){cat=c;val=v;part.src=src(c,v);ptitle.textContent=c+' : '+v;pdesc.textContent='生成済み透過PNG '+c+'_'+v+'_clean.png を表示中。';document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('on',b.dataset.cat===c));renderVars()}function renderVars(){variants.innerHTML='';for(const [v,label] of defs[cat]){const b=document.createElement('button');b.textContent=label;b.className=v===val?'on':'';b.onclick=()=>setPart(cat,v);variants.appendChild(b)}}document.getElementById('cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;setPart(b.dataset.cat,b.dataset.v)};hero.onload=()=>{st.textContent='Clean PNG OK '+hero.naturalWidth+'×'+hero.naturalHeight+' / '+REV};hero.onerror=()=>{st.textContent='clean body 読込失敗'};part.onerror=()=>{pdesc.textContent='このclean素材の読込に失敗'};hero.src=G+'body_base_clean.png?v='+REV;setPart('face','normal');</script></body></html>
