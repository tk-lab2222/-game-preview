<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO LAB v4.0.9</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}main{max-width:520px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.ver{background:#294664;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.card{margin-top:10px;background:#fff;border:1px solid #c8d5e2;border-radius:18px;padding:12px}.stage{min-height:455px;display:grid;place-items:center;background:#f4f9fd;border-radius:15px;position:relative;overflow:hidden}.status{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;background:#fff;padding:6px 9px;border-radius:999px;z-index:3}canvas{width:min(96%,390px);height:auto}.opts{display:flex;gap:6px;flex-wrap:wrap}.row{padding:9px 0}.label{font-weight:900;margin-bottom:6px}button{border:1px solid #aab9ca;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;color:#233a58}button.on{background:#31587f;color:#fff}.small{font-size:11px;color:#5a6c7f;line-height:1.55}.cal{padding:10px;border-radius:14px;background:#f5f9fd}.ctrl{display:grid;grid-template-columns:70px 1fr 62px;gap:8px;align-items:center;margin:8px 0}.ctrl input[type=range]{width:100%}.val{text-align:right;font-size:12px;font-weight:900}.checks{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.ok{color:#25784b;font-weight:900}</style></head><body><main><div class="top"><div><b>☆ STAR ATHLETES</b><div>DRACO ANCHOR LAB</div></div><div class="ver">v4.0.9</div></div><section class="card"><div class="stage"><div id="st" class="status">基準アンカー読込中…</div><canvas id="cv" width="420" height="500"></canvas></div></section><section class="card"><div class="row"><div class="label">基準パーツ</div><div class="opts" id="cats"><button class="on" data-cat="horn">角</button><button data-cat="wing">羽</button><button data-cat="tail">しっぽ</button></div></div><div class="cal"><div class="ctrl"><b>X</b><input id="rx" type="range" min="0" max="1" step="0.002"><span class="val" id="vx"></span></div><div class="ctrl"><b>Y</b><input id="ry" type="range" min="0" max="1" step="0.002"><span class="val" id="vy"></span></div><div class="ctrl"><b>Scale</b><input id="rs" type="range" min="0.1" max="1.5" step="0.005"><span class="val" id="vs"></span></div><div class="ctrl"><b>Rotation</b><input id="rr" type="range" min="-180" max="180" step="1"><span class="val" id="vr"></span></div><div class="checks"><label><input id="fx" type="checkbox"> FlipX</label><label><input id="fy" type="checkbox"> FlipY</label></div></div><div class="row small"><span class="ok">v4.0.9:</span> アンカー仕様を <code>x / y / scale / rotation / flipX / flipY / z</code> に拡張。しっぽは基準でFlipX=true。次は見本枠ではなく、基準ドラコ本体から標準3パーツを直接切り出して完全一致値を固定します。</div></section></main><script>const G='../star-athletes-draco-lab/generated/';const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),st=document.getElementById('st');const A={horn:{x:.50,y:.12,s:.50,r:0,fx:false,fy:false,z:50},wing:{x:.21,y:.42,s:.62,r:0,fx:false,fy:false,z:20},tail:{x:.12,y:.66,s:.58,r:0,fx:true,fy:false,z:10}};let cat='horn',base,part;const els={x:rx,y:ry,s:rs,r:rr,fx,fy};const vals={x:vx,y:vy,s:vs,r:vr};function load(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}function box(){const s=Math.min(370/base.naturalWidth,440/base.naturalHeight),w=base.naturalWidth*s,h=base.naturalHeight*s;return{x:(420-w)/2,y:(500-h)/2+8,w,h}}function render(){if(!base)return;ctx.clearRect(0,0,420,500);const b=box();ctx.drawImage(base,b.x,b.y,b.w,b.h);if(!part)return;const a=A[cat],dw=b.w*a.s,dh=part.naturalHeight*(dw/part.naturalWidth),cx=b.x+b.w*a.x,cy=b.y+b.h*a.y;ctx.save();ctx.translate(cx,cy);ctx.rotate(a.r*Math.PI/180);ctx.scale(a.fx?-1:1,a.fy?-1:1);ctx.globalAlpha=.45;ctx.drawImage(part,-dw/2,-dh/2,dw,dh);ctx.restore()}function sync(){const a=A[cat];els.x.value=a.x;els.y.value=a.y;els.s.value=a.s;els.r.value=a.r;els.fx.checked=a.fx;els.fy.checked=a.fy;vals.x.textContent=a.x.toFixed(3);vals.y.textContent=a.y.toFixed(3);vals.s.textContent=a.s.toFixed(3);vals.r.textContent=Math.round(a.r)+'°';document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat))}async function select(c){cat=c;sync();part=await load(G+c+'_normal_clean.png?v=409');render()}document.getElementById('cats').onclick=e=>{const b=e.target.closest('button');if(b)select(b.dataset.cat)};for(const k of ['x','y','s','r'])els[k].oninput=()=>{A[cat][k]=+els[k].value;sync();render()};els.fx.onchange=()=>{A[cat].fx=els.fx.checked;render()};els.fy.onchange=()=>{A[cat].fy=els.fy.checked;render()};(async()=>{base=await load(G+'body_base_clean.png?v=405c');st.textContent='Flip-aware anchor model ready / 409';await select('horn')})()</script></body></html>
