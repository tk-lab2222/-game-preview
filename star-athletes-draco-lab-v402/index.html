<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO LAB v4.0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}main{max-width:520px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.ver{background:#294664;color:#fff;border-radius:999px;padding:8px 12px}.card{margin-top:10px;background:#fff;border:1px solid #c8d5e2;border-radius:18px;padding:12px}.stage{min-height:410px;display:grid;place-items:center;background:#f4f9fd;border-radius:15px;position:relative}.status{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;background:#fff;padding:6px 9px;border-radius:999px}.err{color:#b13838}canvas{width:min(100%,360px);height:auto}.row{padding:10px 0}.opts{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #aab9ca;background:#fff;border-radius:999px;padding:7px 10px;font-weight:800;color:#233a58}button.on{background:#31587f;color:#fff;border-color:#31587f}.note{font-size:11px;color:#5a6c7f;line-height:1.6}</style></head><body><main><div class="top"><div><b>☆ STAR ATHLETES</b><div>DRACO PARTS LAB</div></div><div class="ver">v4.0.3</div></div><section class="card"><div class="stage"><div id="st" class="status">base読込中…</div><canvas id="cv" width="360" height="430"></canvas></div></section><section class="card"><div class="row"><b>表情</b><div class="opts" id="faces"><button class="on" data-v="0">通常</button><button data-v="1">うれしい</button><button data-v="2">やる気</button><button data-v="3">しょんぼり</button><button data-v="4">つかれ</button></div></div><div class="note">v4.0.3はGitHub上で1文字欠けていたbase/05チャンクをブラウザ側で補完してCanvasへ復元します。まず基準ドラコ＋表情5種の安定表示を確認します。</div></section></main><script>const cv=document.getElementById('cv'),x=cv.getContext('2d'),st=document.getElementById('st');let base=null,face=0;async function loadBase(){let s='';for(let i=0;i<7;i++){const p='../star-athletes-draco-lab/assets-v4/base/'+String(i).padStart(2,'0')+'.txt?v=403';const r=await fetch(p);if(!r.ok)throw Error('base '+i+' HTTP '+r.status);let t=(await r.text()).replace(/[^A-Za-z0-9+/=]/g,'');if(i===5&&t.length===15999)t+='q';s+=t}if(s.length!==101744)throw Error('base length '+s.length);const im=new Image();im.src='data:image/webp;base64,'+s;await new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(Error('base image decode'))});return im}function render(){if(!base)return;x.clearRect(0,0,360,430);x.fillStyle='#f3f8fd';x.fillRect(0,0,360,430);x.drawImage(base,0,80,315,368,22,28,316,370);if(face>0)x.drawImage(base,face*80,0,80,80,160,112,88,88)}document.getElementById('faces').onclick=e=>{if(!e.target.dataset.v)return;face=+e.target.dataset.v;document.querySelectorAll('#faces button').forEach(b=>b.classList.toggle('on',+b.dataset.v===face));render()};(async()=>{try{base=await loadBase();st.textContent='Base Atlas OK '+base.naturalWidth+'×'+base.naturalHeight;render()}catch(e){st.classList.add('err');st.textContent='読込失敗: '+e.message}})();</script></body></html>
