<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO LAB v4.1.2</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}main{max-width:520px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.ver{background:#294664;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.card{margin-top:10px;background:#fff;border:1px solid #c8d5e2;border-radius:18px;padding:12px}.stage{min-height:455px;display:grid;place-items:center;background:#f4f9fd;border-radius:15px;position:relative;overflow:hidden}.status{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;background:#fff;padding:6px 9px;border-radius:999px;z-index:3}canvas{width:min(96%,390px);height:auto}.opts{display:flex;gap:6px;flex-wrap:wrap}.row{padding:9px 0}.label{font-weight:900;margin-bottom:6px}button{border:1px solid #aab9ca;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;color:#233a58}button.on{background:#31587f;color:#fff}.ctrl{display:grid;grid-template-columns:72px 1fr 58px;gap:8px;align-items:center;margin-top:8px}.ctrl input{width:100%}.checks{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.checks label{font-size:12px;font-weight:800}.small{font-size:11px;color:#5a6c7f;line-height:1.55}.ok{color:#25784b;font-weight:900}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.meta div{padding:8px;border-radius:10px;background:#f5f9fd;font-size:11px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8f1f8;font-size:10px;font-weight:900}</style></head><body><main><div class="top"><div><b>☆ STAR ATHLETES</b><div>DRACO VARIANT FIT LAB</div></div><div class="ver">v4.1.2</div></div><section class="card"><div class="stage"><div id="st" class="status">差分パーツ読込中…</div><canvas id="cv" width="545" height="515"></canvas></div></section><section class="card"><div class="row"><div class="label">部位</div><div class="opts" id="cats"><button class="on" data-cat="horn">角</button><button data-cat="wing">羽</button><button data-cat="tail">しっぽ</button></div></div><div class="row"><div class="label">形状</div><div class="opts" id="vars"></div></div><div class="row"><div class="label">確認スロット</div><div class="opts" id="slots"></div></div><div class="row"><span class="tag" id="mode"></span></div><div class="ctrl"><b>X補正</b><input id="dx" type="range" min="-0.20" max="0.20" step="0.002" value="0"><span id="vdx">0.000</span></div><div class="ctrl"><b>Y補正</b><input id="dy" type="range" min="-0.20" max="0.20" step="0.002" value="0"><span id="vdy">0.000</span></div><div class="ctrl"><b>Scale</b><input id="sc" type="range" min="0.40" max="1.80" step="0.01" value="1"><span id="vsc">1.00</span></div><div class="ctrl"><b>Rotation</b><input id="rot" type="range" min="-180" max="180" step="1" value="0"><span id="vrot">0°</span></div><div class="ctrl"><b>Opacity</b><input id="op" type="range" min="0" max="1" step="0.05" value="0.65"><span id="vop">0.65</span></div><div class="checks"><label><input id="fx" type="checkbox"> FlipX</label><label><input id="fy" type="checkbox"> FlipY</label></div><div class="meta" id="meta"></div><div class="row small"><span class="ok">v4.1.2:</span> normalは左右referenceをそのまま使うため完全一致。差分形状だけ、確定済み左右アンカーへScale / Rotation / Flip / 微小オフセットでフィットさせます。しっぽ差分はFlipX=trueを初期値にしています。</div></section></main><script src="./app412.js?v=412"></script></body></html>
