<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO LAB v4.0.7</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}main{max-width:520px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.ver{background:#294664;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.card{margin-top:10px;background:#fff;border:1px solid #c8d5e2;border-radius:18px;padding:12px}.stage{min-height:455px;display:grid;place-items:center;background:linear-gradient(#f7fbff,#edf5fb);border-radius:15px;position:relative;overflow:hidden}.status{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;background:#fff;padding:6px 9px;border-radius:999px;z-index:3}.checker{background-color:#eef4fb;background-image:linear-gradient(45deg,#dce8f3 25%,transparent 25%),linear-gradient(-45deg,#dce8f3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dce8f3 75%),linear-gradient(-45deg,transparent 75%,#dce8f3 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}canvas{width:min(96%,390px);height:auto;filter:drop-shadow(0 12px 14px rgba(41,70,100,.15))}.row{padding:9px 0}.label{font-weight:900;margin-bottom:6px}.opts{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #aab9ca;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;color:#233a58}button.on{background:#31587f;color:#fff;border-color:#31587f}.small{font-size:11px;color:#5a6c7f;line-height:1.55}.ok{color:#25784b;font-weight:900}.cal{padding:10px;border-radius:14px;background:#f5f9fd;margin-top:8px}.ctrl{display:grid;grid-template-columns:68px 1fr 54px;gap:8px;align-items:center;margin:8px 0}.ctrl input[type=range]{width:100%}.val{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.ghost{background:#f5f9fd}.warn{color:#895f16;font-size:11px;line-height:1.55}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8f1f8;font-size:10px;font-weight:900}.switch{display:flex;align-items:center;gap:8px;margin:8px 0}.switch input{width:20px;height:20px}</style></head><body><main><div class="top"><div><b>☆ STAR ATHLETES</b><div>DRACO ANCHOR LAB</div></div><div class="ver">v4.0.7</div></div><section class="card"><div class="stage checker"><div id="st" class="status">調整素材読込中…</div><canvas id="cv" width="420" height="500"></canvas></div></section><section class="card"><div class="row"><div class="label">標準パーツを完全一致させる</div><div class="opts" id="cats"><button class="on" data-cat="horn">標準角</button><button data-cat="wing">標準羽</button><button data-cat="tail">標準しっぽ</button></div></div><div class="cal"><div><span class="pill" id="current">horn / normal</span></div><div class="switch"><input id="visible" type="checkbox" checked><label for="visible"><b>半透明オーバーレイ表示</b></label></div><div class="ctrl"><b>X</b><input id="rx" type="range" min="0" max="1" step="0.002"><span class="val" id="vx"></span></div><div class="ctrl"><b>Y</b><input id="ry" type="range" min="0" max="1" step="0.002"><span class="val" id="vy"></span></div><div class="ctrl"><b>Scale</b><input id="rs" type="range" min="0.10" max="1.20" step="0.005"><span class="val" id="vs"></span></div><div class="ctrl"><b>Opacity</b><input id="ro" type="range" min="0.10" max="1.00" step="0.05"><span class="val" id="vo"></span></div><div class="actions"><button id="save">この位置を保存</button><button id="reset" class="ghost">このパーツを初期化</button><button id="resetAll" class="ghost">3種すべて初期化</button></div></div><div class="row warn">元絵に描かれている標準パーツと、半透明レイヤーがぴったり重なるまで調整してください。ここで保存した X / Y / Scale が、次に別形状パーツを載せる基準アンカーになります。</div><div class="small"><span class="ok">v4.0.7:</span> 標準角 → 標準羽 → 標準しっぽの順に基準アンカーを確定する段階。保存値はこの端末のlocalStorageに保持します。</div></section></main><script>const G='../star-athletes-draco-lab/generated/';const REV='407';const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),st=document.getElementById('st');const inputs={x:document.getElementById('rx'),y:document.getElementById('ry'),s:document.getElementById('rs'),o:document.getElementById('ro')};const vals={x:document.getElementById('vx'),y:document.getElementById('vy'),s:document.getElementById('vs'),o:document.getElementById('vo')};const visible=document.getElementById('visible'),current=document.getElementById('current');const KEY='draco_anchor_v407';const defaults={horn:{x:.50,y:.12,s:.50,o:.45},wing:{x:.21,y:.42,s:.62,o:.45},tail:{x:.12,y:.66,s:.58,o:.45}};let anchors=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaults);for(const k of Object.keys(defaults))anchors[k]={...defaults[k],...(anchors[k]||{})};let cat='horn',base=null,overlay=null;function load(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(Error(src));im.src=src})}function baseBox(){if(!base)return null;const maxW=370,maxH=440,s=Math.min(maxW/base.naturalWidth,maxH/base.naturalHeight),w=base.naturalWidth*s,h=base.naturalHeight*s,x=(420-w)/2,y=(500-h)/2+8;return{x,y,w,h}}function render(){ctx.clearRect(0,0,420,500);if(!base)return;const b=baseBox();ctx.drawImage(base,b.x,b.y,b.w,b.h);if(overlay&&visible.checked){const a=anchors[cat],dw=b.w*a.s,dh=overlay.naturalHeight*(dw/overlay.naturalWidth),x=b.x+b.w*a.x-dw/2,y=b.y+b.h*a.y-dh/2;ctx.save();ctx.globalAlpha=a.o;ctx.drawImage(overlay,x,y,dw,dh);ctx.restore();ctx.save();ctx.strokeStyle='rgba(38,92,136,.65)';ctx.setLineDash([5,4]);ctx.strokeRect(x,y,dw,dh);ctx.restore()}}function sync(){const a=anchors[cat];inputs.x.value=a.x;inputs.y.value=a.y;inputs.s.value=a.s;inputs.o.value=a.o;vals.x.textContent=a.x.toFixed(3);vals.y.textContent=a.y.toFixed(3);vals.s.textContent=a.s.toFixed(3);vals.o.textContent=a.o.toFixed(2);current.textContent=cat+' / normal';document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat))}async function select(c){cat=c;sync();try{overlay=await load(G+c+'_normal_clean.png?v='+REV);render()}catch(e){st.textContent='標準パーツ読込失敗: '+c}}document.getElementById('cats').onclick=e=>{const b=e.target.closest('button');if(b)select(b.dataset.cat)};for(const [k,el] of Object.entries(inputs)){el.oninput=()=>{anchors[cat][k]=+el.value;sync();render()}}visible.onchange=render;document.getElementById('save').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(anchors));st.textContent='保存しました: '+cat+' / '+JSON.stringify(anchors[cat])};document.getElementById('reset').onclick=()=>{anchors[cat]={...defaults[cat]};sync();render()};document.getElementById('resetAll').onclick=()=>{anchors=structuredClone(defaults);localStorage.removeItem(KEY);sync();render()};(async()=>{try{base=await load(G+'body_base_clean.png?v=405c');st.textContent='Anchor calibration ready / 407';await select('horn')}catch(e){st.textContent='読込失敗'}})();</script></body></html>
