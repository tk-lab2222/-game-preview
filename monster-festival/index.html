<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MONSTER FESTIVAL</title><style>:root{--ink:#252117;--paper:#fffdf6;--bg:#f6e9c8;--a:#ff7e67;--b:#ffd45c;--g:#73c98f;--bl:#72b9f2}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#fff6d9,#efdcae);font-family:ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:var(--ink)}.app{max-width:520px;margin:auto;min-height:100dvh;padding:12px 12px 95px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;font-size:22px}.sub,.tiny{font-size:11px;opacity:.62;font-weight:800}.res{display:flex;gap:6px}.pill{padding:6px 9px;background:#fff;border:2px solid #222;border-radius:999px;font-size:12px;font-weight:1000}.panel{background:var(--paper);border:2.5px solid #222;border-radius:22px;margin:11px 0;padding:12px;box-shadow:0 5px 0 #0002}.title{font-size:15px;font-weight:1000;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{position:relative;background:#fff;border:2px solid #222;border-radius:18px;padding:9px;box-shadow:0 3px 0 #0002}.card.sel{outline:4px solid var(--b)}.rar{position:absolute;right:7px;top:7px;background:#222;color:#fff;border-radius:8px;padding:2px 6px;font-size:9px;font-weight:1000}.lv{position:absolute;left:7px;top:7px;background:#fff;border:1.5px solid #222;border-radius:8px;padding:2px 5px;font-size:9px;font-weight:1000}.avatar{width:82px;height:66px;margin:14px auto 4px;border:2.5px solid #222;border-radius:50% 50% 42% 42%;position:relative;background:var(--c);box-shadow:inset 0 -8px 0 #0001}.eye{position:absolute;width:7px;height:10px;background:#222;border-radius:50%;top:24px}.eye.l{left:24px}.eye.r{right:24px}.mouth{position:absolute;width:18px;height:8px;border-bottom:2px solid #222;border-radius:50%;left:31px;top:39px}.horn{position:absolute;width:16px;height:16px;background:var(--c);border:2.5px solid #222;transform:rotate(45deg);top:-8px;border-radius:3px}.horn.l{left:10px}.horn.r{right:10px}.ear{position:absolute;width:18px;height:25px;background:var(--c);border:2.5px solid #222;top:-15px;border-radius:70%}.ear.l{left:9px;transform:rotate(-18deg)}.ear.r{right:9px;transform:rotate(18deg)}.name{text-align:center;font-weight:1000;font-size:14px}.meta{text-align:center;font-size:10px;font-weight:800;opacity:.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:7px}.st{font-size:9px;font-weight:900;padding:4px;background:#f3eee1;border-radius:7px;text-align:center}.btn{width:100%;border:2.5px solid #222;border-radius:15px;padding:12px;font-size:14px;font-weight:1000;background:#222;color:#fff;box-shadow:0 4px 0 #0003}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}.btn.y{background:var(--b);color:#332800}.btn.g{background:var(--g);color:#12351c}.btn.o{background:var(--a)}.btn:disabled{opacity:.35}.row{display:flex;gap:7px}.row>*{flex:1}.trainer{display:grid;grid-template-columns:1fr 1fr;gap:7px}.train{border:2px solid #222;background:#fff;border-radius:12px;padding:9px;font-weight:900;font-size:11px}.team{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.slot{min-height:92px;border:2px dashed #888;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:900;background:#fffaf0}.slot.f{border-style:solid;border-color:#222}.score{font-size:38px;font-weight:1000;text-align:center}.events{display:grid;gap:7px}.event{border:2px solid #222;border-radius:13px;padding:9px;background:#fff}.eventhead{display:flex;justify-content:space-between;font-weight:1000;font-size:12px}.bar{height:8px;background:#eee;border:1.5px solid #222;border-radius:999px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#222}.log{margin-top:8px;padding:9px;border:2px solid #222;border-radius:12px;background:#fff;font-size:11px;font-weight:800;line-height:1.5}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffdf6;border-top:2.5px solid #222;padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.tab{border:0;background:transparent;font-size:10px;font-weight:1000;padding:5px}.tab b{display:block;font-size:22px}.tab.on{background:#ffe9a0;border-radius:13px}.view{display:none}.view.on{display:block}.breedslots{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;gap:6px}.toast{position:fixed;top:65px;left:50%;transform:translate(-50%,-15px);background:#222;color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:1000;opacity:0;transition:.2s;z-index:99}.toast.on{opacity:1;transform:translate(-50%,0)}</style></head><body><div class="app"><div class="top"><div><div class="logo">🏟️ MONSTER FESTIVAL</div><div class="sub">BREED · TRAIN · TEAM · COMPETE</div></div><div class="res"><div class="pill">🍎 <span id="food">24</span></div><div class="pill">⭐ <span id="medal">0</span></div></div></div><section id="home" class="view on"><div class="panel"><div class="title">選手たち <span class="tiny">タップで選択</span></div><div id="roster" class="grid"></div></div></section><section id="train" class="view"><div class="panel"><div class="title">育成 <span class="tiny">育成ポイント <span id="tp">12</span></span></div><div id="trainTarget" class="tiny">選手を選んでください</div><div style="height:8px"></div><div class="trainer"><button class="train" data-stat="pow">💪 POW +1</button><button class="train" data-stat="spd">⚡ SPD +1</button><button class="train" data-stat="sta">❤️ STA +1</button><button class="train" data-stat="agi">🪽 AGI +1</button><button class="train" data-stat="tec">🎯 TEC +1</button><button class="train" data-stat="gut">🔥 GUT +1</button></div><div class="log" id="trainLog">能力を伸ばすと競技結果が変わります。成長しやすさは個体ごとに違います。</div></div></section><section id="teamv" class="view"><div class="panel"><div class="title">3体チーム <span class="tiny">選手カードをタップ</span></div><div id="teamSlots" class="team"></div><div style="height:9px"></div><button id="compete" class="btn g">🏁 運動会に挑戦</button></div><div class="panel"><div class="title">大会結果</div><div class="score" id="totalScore">---</div><div id="events" class="events"></div><div id="compLog" class="log">3体選んで大会に挑もう。</div></div></section><section id="breed" class="view"><div class="panel"><div class="title">交配 <span class="tiny">低確率で希少種</span></div><div class="breedslots"><div id="p1" class="slot">親①</div><div style="text-align:center;font-weight:1000">×</div><div id="p2" class="slot">親②</div></div><div style="height:9px"></div><button id="breedBtn" class="btn o" disabled>🥚 交配する（🍎6）</button><div id="egg" class="log">親を2体選択すると交配できます。</div></div></section></div><div class="tabs"><button class="tab on" data-v="home"><b>🐾</b>選手</button><button class="tab" data-v="train"><b>🏋️</b>育成</button><button class="tab" data-v="teamv"><b>🏟️</b>大会</button><button class="tab" data-v="breed"><b>🥚</b>交配</button></div><div id="toast" class="toast"></div><script>const C=['#83d4aa','#78bff2','#ff9ca7','#f5c75e','#b796e8','#83d8d0','#f29b62'];const N=['ポム','ルル','モコ','ピピ','ノア','クル','ミミ','ロロ','ココ','ベル','トト','ララ'];const R=['C','U','R','SR','SSR','UR','EX'];let s={food:24,medal:0,tp:12,next:7,selected:null,parents:[],team:[1,2,3],mons:[{id:1,n:'ポム',r:0,c:C[0],shape:'ear',lv:1,pow:7,spd:11,sta:8,agi:10,tec:7,gut:9,growth:1.12,gene:1.03},{id:2,n:'ルル',r:0,c:C[1],shape:'horn',lv:1,pow:9,spd:8,sta:10,agi:7,tec:10,gut:8,growth:1.05,gene:1.08},{id:3,n:'モコ',r:1,c:C[2],shape:'ear',lv:1,pow:11,spd:7,sta:11,agi:7,tec:6,gut:12,growth:1.10,gene:1.04},{id:4,n:'ピピ',r:0,c:C[3],shape:'horn',lv:1,pow:6,spd:12,sta:7,agi:12,tec:8,gut:7,growth:1.14,gene:1.01},{id:5,n:'ノア',r:1,c:C[4],shape:'ear',lv:1,pow:8,spd:9,sta:8,agi:10,tec:12,gut:8,growth:1.07,gene:1.10},{id:6,n:'クル',r:0,c:C[5],shape:'horn',lv:1,pow:10,spd:8,sta:12,agi:6,tec:7,gut:11,growth:1.04,gene:1.12}]};const $=q=>document.querySelector(q);function av(m){return `<div class="avatar" style="--c:${m.c}">${m.shape==='horn'?'<i class="horn l"></i><i class="horn r"></i>':'<i class="ear l"></i><i class="ear r"></i>'}<i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div>`}function card(m){return `<div class="card ${s.selected===m.id?'sel':''}" data-id="${m.id}"><span class="lv">Lv.${m.lv}</span><span class="rar">${R[m.r]}</span>${av(m)}<div class="name">${m.n}</div><div class="meta">総合 ${sum(m)}</div><div class="stats"><div class="st">力 ${m.pow}</div><div class="st">速 ${m.spd}</div><div class="st">持 ${m.sta}</div><div class="st">敏 ${m.agi}</div><div class="st">技 ${m.tec}</div><div class="st">根 ${m.gut}</div></div></div>`}function sum(m){return m.pow+m.spd+m.sta+m.agi+m.tec+m.gut}function toast(x){let e=$('#toast');e.textContent=x;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1100)}function render(){$('#food').textContent=s.food;$('#medal').textContent=s.medal;$('#tp').textContent=s.tp;$('#roster').innerHTML=s.mons.map(card).join('');document.querySelectorAll('.card').forEach(e=>e.onclick=()=>select(+e.dataset.id));let m=s.mons.find(x=>x.id===s.selected);$('#trainTarget').innerHTML=m?`${av(m)}<div class="name">${m.n} / ${R[m.r]} / 総合 ${sum(m)}</div>`:'選手を選んでください';renderTeam();renderParents()}function select(id){s.selected=id;if(!s.team.includes(id)&&s.team.length<3)s.team.push(id);else if(s.team.includes(id)&&$('#teamv').classList.contains('on'))s.team=s.team.filter(x=>x!==id);if($('#breed').classList.contains('on')){if(s.parents.includes(id))s.parents=s.parents.filter(x=>x!==id);else if(s.parents.length<2)s.parents.push(id);else s.parents=[s.parents[1],id]}render()}function renderTeam(){$('#teamSlots').innerHTML=[0,1,2].map(i=>{let m=s.mons.find(x=>x.id===s.team[i]);return m?`<div class="slot f">${av(m)}<div>${m.n}</div></div>`:`<div class="slot">空き</div>`}).join('')}function renderParents(){['p1','p2'].forEach((id,i)=>{let m=s.mons.find(x=>x.id===s.parents[i]);$("#"+id).className='slot'+(m?' f':'');$("#"+id).innerHTML=m?`${av(m)}<div>${m.n}</div>`:`親${i+1}`});$('#breedBtn').disabled=s.parents.length!==2||s.food<6}document.querySelectorAll('.train').forEach(b=>b.onclick=()=>{let m=s.mons.find(x=>x.id===s.selected);if(!m)return toast('選手を選んでね');if(s.tp<1)return toast('育成ポイント不足');let st=b.dataset.stat;let gain=Math.random()<m.growth-1?2:1;m[st]+=gain;m.lv++;s.tp--;$('#trainLog').textContent=`${m.n}の${st.toUpperCase()}が+${gain}。この子は${gain===2?'伸びた！':'少し成長した。'}`;render()});const weights={短距離:{spd:.6,agi:.25,gut:.15},障害物:{agi:.4,tec:.3,pow:.2,gut:.1},綱引き:{pow:.5,sta:.3,gut:.2},バトル:{pow:.35,sta:.2,tec:.25,gut:.2}};$('#compete').onclick=()=>{if(s.team.length<3)return toast('3体チームにしてね');let team=s.team.map(id=>s.mons.find(m=>m.id===id));let total=0,out='';Object.entries(weights).forEach(([name,w])=>{let base=team.reduce((z,m)=>z+Object.entries(w).reduce((q,[k,v])=>q+m[k]*v,0),0)/3;let val=Math.round(base*(.88+Math.random()*.24)*10);total+=val;out+=`<div class="event"><div class="eventhead"><span>${name}</span><span>${val}pt</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,val/2)}%"></div></div></div>`});s.medal+=Math.max(1,Math.floor(total/180));s.food+=4;s.tp+=3;$('#totalScore').textContent=total+' pt';$('#events').innerHTML=out;$('#compLog').textContent=`大会終了！ 🍎+4 / 育成P+3。総合力だけでなく競技向きの配分が重要。`;render()};function baby(a,b){let avg=k=>Math.max(3,Math.round(((a[k]+b[k])/2)*(.9+Math.random()*.18)));let rare=Math.random(),rr=0;if(rare<.015)rr=4;else if(rare<.05)rr=3;else if(rare<.16)rr=2;else if(rare<.42)rr=1;rr=Math.min(6,rr+Math.floor((a.r+b.r)/4));let bonus=rr;return{id:s.next++,n:N[Math.floor(Math.random()*N.length)],r:rr,c:Math.random()<.5?a.c:b.c,shape:Math.random()<.5?a.shape:b.shape,lv:1,pow:avg('pow')+bonus,spd:avg('spd')+bonus,sta:avg('sta')+bonus,agi:avg('agi')+bonus,tec:avg('tec')+bonus,gut:avg('gut')+bonus,growth:(a.growth+b.growth)/2+(Math.random()-.5)*.08,gene:(a.gene+b.gene)/2+(Math.random()-.5)*.08}}$('#breedBtn').onclick=()=>{let[a,b]=s.parents.map(id=>s.mons.find(m=>m.id===id));s.food-=6;let c=baby(a,b);s.mons.push(c);s.parents=[];$('#egg').innerHTML=`🥚→ ${R[c.r]} <b>${c.n}</b> が誕生！ 総合 ${sum(c)}。成長性や遺伝力はまだ未知。`;s.selected=c.id;render()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('#'+t.dataset.v).classList.add('on');render()});render();</script></body></html>
