name: Build Draco assets

on:
  push:
    branches: [main]
    paths:
      - 'star-athletes-draco-lab/assets-source/**'
      - 'scripts/build_draco_assets.py'
      - 'scripts/build_draco_variant_parts.py'
      - '.github/workflows/build-draco-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/build_draco_assets.py
      - run: python scripts/build_draco_variant_parts.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-athletes-draco-lab/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate Draco assets"
            git push
          fi
