</style></head><body><main class="app"><header><div class="title">🔥 星火ピンボール</div><div class="ver">v0.9</div></header><section class="hud"><div class="stat"><b id="score">0</b><span>スコア</span></div><div class="stat timer" id="timerBox"><b id="time">60.0</b><span>残り秒</span></div><div class="stat"><b id="best">0</b><span>ベスト</span></div></section><div class="guide"><strong>🎯 今の狙い</strong><b id="guide">赤い的 0/3</b></div><div class="boss"><span class="name">🐉 虚空竜ヴァルガ</span><span class="bar"><i id="hpbar"></i></span><small id="hptext">120/120</small></div><div class="machine"><canvas id="c" width="360" height="560"></canvas></div><div class="controls"><button id="L">◀ 左</button><button id="R">右 ▶</button><button id="launch" class="launch">発射！</button></div><div class="note" id="note">実機風フィールド：黄色＝主目標 ／ 虹色「？」＝ランダム抽選</div></main><div class="pop" id="pop"></div><div class="result" id="result" hidden><div class="card"><h2>タイムアップ！</h2><p id="resultText"></p><button id="again">もう一度</button></div></div><script>
(()=>{'use strict';
const W=360,H=560,c=document.getElementById('c'),x=c.getContext('2d'),scoreE=document.getElementById('score'),timeE=document.getElementById('time'),timerBox=document.getElementById('timerBox'),bestE=document.getElementById('best'),guideE=document.getElementById('guide'),hpbar=document.getElementById('hpbar'),hptext=document.getElementById('hptext'),note=document.getElementById('note'),pop=document.getElementById('pop'),result=document.getElementById('result'),resultText=document.getElementById('resultText');
let savedBest=0;try{savedBest=+(localStorage.getItem('sf_best')||0)}catch(_e){}let score=0,best=savedBest,time=60,running=false,ended=false,last=0,boss=120,stage=0,L=false,R=false,la=.22,ra=-.22,attack=9,curse=0,fever=0,bank=[0,0,0],cool=0;bestE.textContent=best;

function say(t){note.textContent=t}function flash(t){pop.textContent=t;pop.classList.remove('show');void pop.offsetWidth;pop.classList.add('show')}function add(n){score+=Math.round(n*(fever>0?2:1));scoreE.textContent=score}function dmg(n,label){boss=Math.max(0,boss-n);hpbar.style.transform=`scaleX(${boss/120})`;hptext.textContent=`${boss}/120`;flash(`${label} -${n}HP`);if(boss<=0){add(5000);time=Math.min(90,time+10);boss=120;hpbar.style.transform='scaleX(1)';hptext.textContent='120/120';bank=[0,0,0];stage=0;flash('BOSS BREAK! +10秒');say('ボス撃破！ 次のヴァルガが出現！')}}
function resetBall(){ball.x=318;ball.y=486;ball.vx=ball.vy=0;ball.on=false}function launch(){if(ended||ball.on)return;if(!running){running=true;say('60秒スタート！ 黄色の主目標と虹色抽選穴を狙え！')}ball.on=true;ball.x=318;ball.y=486;ball.vx=0;ball.vy=-14.3}

function circle(o,power=1){const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy),m=ball.r+o.r;if(!ball.on||!d||d>=m)return false;const nx=dx/d,ny=dy/d,v=ball.vx*nx+ball.vy*ny;ball.x=o.x+nx*m;ball.y=o.y+ny*m;if(v<0){ball.vx-=1.8*v*nx;ball.vy-=1.8*v*ny}ball.vx+=nx*2.5*power;ball.vy+=ny*2.5*power;add(100);dmg(1,'BUMPER');return true}
function lineHit(px,py,ang,left){const len=76,tx=px+Math.cos(ang)*len*(left?1:-1),ty=py+Math.sin(ang)*len*(left?1:-1),dx=tx-px,dy=ty-py,t=Math.max(0,Math.min(1,((ball.x-px)*dx+(ball.y-py)*dy)/(dx*dx+dy*dy))),cx=px+dx*t,cy=py+dy*t,ox=ball.x-cx,oy=ball.y-cy,d=Math.hypot(ox,oy);if(!d||d>ball.r+8)return;let nx=ox/d,ny=oy/d;if(ny>0){nx=-nx;ny=-ny}const v=ball.vx*nx+ball.vy*ny;if(v<1){ball.x=cx+nx*(ball.r+8);ball.y=cy+ny*(ball.r+8);ball.vx-=1.8*v*nx;ball.vy-=1.8*v*ny;ball.vy=Math.min(ball.vy,left&&L||!left&&R?-9.5:-5.5);ball.vx+=(left?1:-1)*(1+t*2.3);add(20)}}
function lucky(){for(const h of holes){if(h.cd>0)continue;const d=Math.hypot(ball.x-h.x,ball.y-h.y);if(d>ball.r+h.r+2)continue;h.cd=100;const q=Math.random();if(q<.36){const n=400+Math.floor(Math.random()*3)*200;add(n);flash(`🎰 +${n}点`)}else if(q<.62){const s=2+Math.floor(Math.random()*2);time=Math.min(90,time+s);flash(`🎰 TIME +${s}秒`)}else if(q<.84){const d=5+Math.floor(Math.random()*4);dmg(d,'🎰 抽選')}else{fever=360;flash('🎰 FEVER ×2 / 6秒')}ball.x=h.x;ball.y=h.y-13;ball.vx=(h.x<180?1:-1)*3;ball.vy=-6.5;return}}
function targets(){if(ball.y<246||ball.y>290)return;for(let i=0;i<3;i++){if(bank[i])continue;if(Math.abs(ball.x-targetX[i])<12){bank[i]=1;ball.vy=-Math.abs(ball.vy)-2;add(150);dmg(3,'赤い的');guideE.textContent=`赤い的 ${bank.filter(Boolean).length}/3`;if(bank.every(Boolean)){add(1000);dmg(12,'装甲破壊');stage=1;guideE.textContent='左上ランプを通せ！';flash('装甲破壊！ 次→左上ランプ')}return}}}

function tick(dt){if(running&&!ended){time-=dt/60;if(time<=0){time=0;ended=true;ball.on=false;if(score>best){best=score;try{localStorage.setItem('sf_best',best)}catch(_e){}bestE.textContent=best}resultText.textContent=`スコア ${score.toLocaleString()} ／ ボス残HP ${boss}`;result.hidden=false}timeE.textContent=Math.max(0,time).toFixed(1);timerBox.classList.toggle('danger',time<=10)}if(cool>0)cool-=dt;if(fever>0)fever-=dt;holes.forEach(h=>h.cd=Math.max(0,(h.cd||0)-dt));attack-=dt/60;if(attack<=0){attack=9;curse=300;flash('⚠ 重力嵐 5秒！')}if(curse>0)curse-=dt;if(!ball.on)return;la+=((L?-.45:.22)-la)*Math.min(1,.25*dt);ra+=((R?.45:-.22)-ra)*Math.min(1,.25*dt);ball.vy+=(curse>0?.31:.205)*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.999;ball.vy*=.999;if(ball.x<14){ball.x=14;ball.vx=Math.abs(ball.vx)*.86}if(ball.x>346){ball.x=346;ball.vx=-Math.abs(ball.vx)*.86}if(ball.y<22){ball.y=22;ball.vy=Math.abs(ball.vy)*.86}
// shooter lane -> upper arch -> live playfield
if(ball.x>300&&ball.y<92&&ball.vy<0){ball.x=292;ball.y=76;ball.vx=-6.2;ball.vy=2.2;add(50);flash('PLAYFIELD IN!')}
// keep launched ball inside shooter lane until it reaches the arch
if(ball.x>298&&ball.y>92&&ball.vy<0){ball.x=Math.max(306,Math.min(334,ball.x));ball.vx*=.25}
// lower slingshots: kick the ball back upward/inward
for(const s of [{x:72,y:424,side:1},{x:288,y:424,side:-1}]){const dx=ball.x-s.x,dy=ball.y-s.y,d=Math.hypot(dx,dy);if(d<30&&ball.y<452&&ball.y>392){ball.vy=Math.min(ball.vy,-7.4);ball.vx+=s.side*2.8;add(75)}}
bump.forEach(b=>circle(b,1.18));targets();lucky();missions();lineHit(100,492,la,true);lineHit(260,492,ra,false);if(ball.y>525)drain()}
function draw(){x.clearRect(0,0,W,H);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111a4a');g.addColorStop(1,'#080d27');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='#756dca';x.lineWidth=4;x.strokeRect(8,18,344,534);x.fillStyle='#bdb9ed';x.font='800 11px system-ui';x.textAlign='center';x.fillText('STARFIRE / LUCKY FIELD',180,38);
// lanes and ramp
x.strokeStyle=stage===1?'#ffe46f':'#ffb56988';x.lineWidth=stage===1?6:3;x.beginPath();x.moveTo(25,230);x.quadraticCurveTo(50,92,146,62);x.stroke();x.fillStyle='#ffcf75';x.font='900 10px system-ui';x.fillText('左ランプ',62,118);
// target bank
for(let i=0;i<3;i++){x.fillStyle=bank[i]?'#50344a':'#ff507d';x.shadowColor=!bank[i]&&stage===0?'#ffe46f':'transparent';x.shadowBlur=!bank[i]&&stage===0?16:0;x.fillRect(targetX[i]-8,256,16,31);x.shadowBlur=0}if(stage===0){x.strokeStyle='#ffe46f';x.lineWidth=2;x.strokeRect(51,247,86,50)}
// gate
x.strokeStyle=stage===2?'#ffe46f':'#7a70c0';x.lineWidth=stage===2?7:3;x.beginPath();x.arc(180,365,42,Math.PI,0);x.stroke();x.fillStyle=stage===2?'#fff3a3':'#978fc9';x.font='900 22px system-ui';x.fillText('★',180,363);
// holes
holes.forEach((h,i)=>{const hue=(285+i*40+(performance.now()/30))%360;x.beginPath();x.arc(h.x,h.y,h.r+5,0,Math.PI*2);x.fillStyle=`hsla(${hue},85%,60%,.2)`;x.fill();x.beginPath();x.arc(h.x,h.y,h.r,0,Math.PI*2);x.fillStyle='#08071b';x.strokeStyle=`hsl(${hue},95%,72%)`;x.lineWidth=2;x.shadowColor=`hsl(${hue},95%,70%)`;x.shadowBlur=10;x.fill();x.stroke();x.shadowBlur=0;x.fillStyle='#fff';x.font='900 10px system-ui';x.fillText('?',h.x,h.y+3)});
// shooter lane and top arch: metal rails + translucent guide
x.save();
x.strokeStyle='#cbd3e8';x.lineWidth=3;x.shadowColor='#e8f0ff';x.shadowBlur=4;
x.beginPath();x.moveTo(301,505);x.lineTo(301,104);x.quadraticCurveTo(303,55,258,44);x.quadraticCurveTo(205,30,145,50);x.stroke();
x.beginPath();x.moveTo(340,505);x.lineTo(340,92);x.quadraticCurveTo(336,43,286,28);x.stroke();x.shadowBlur=0;
x.strokeStyle='rgba(160,205,255,.28)';x.lineWidth=10;x.beginPath();x.moveTo(306,488);x.lineTo(306,105);x.quadraticCurveTo(306,70,274,58);x.stroke();

x.fillStyle='#aeb8d2';x.font='700 8px system-ui';x.fillText('SHOOTER LANE',321,470);

function loop(t){const dt=Math.min(1.5,(t-last)/16.67||1);last=t;tick(dt);draw();requestAnimationFrame(loop)}
function bind(id,set){const e=document.getElementById(id);const on=q=>{q.preventDefault();set(true);e.classList.add('on')},off=q=>{q.preventDefault();set(false);e.classList.remove('on')};e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off);e.addEventListener('touchstart',on,{passive:false});e.addEventListener('touchend',off,{passive:false})}bind('L',v=>L=v);bind('R',v=>R=v);document.getElementById('launch').addEventListener('pointerdown',e=>{e.preventDefault();launch()});document.getElementById('launch').addEventListener('touchstart',e=>{e.preventDefault();launch()},{passive:false});c.addEventListener('pointerdown',()=>{if(!ball.on)launch()});document.getElementById('again').onclick=()=>{score=0;time=60;running=false;ended=false;boss=120;stage=0;bank=[0,0,0];fever=curse=0;hpbar.style.transform='scaleX(1)';hptext.textContent='120/120';guideE.textContent='赤い的 0/3';scoreE.textContent='0';timeE.textContent='60.0';result.hidden=true;resetBall();say('実機風フィールド：黄色＝主目標 ／ 虹色「？」＝ランダム抽選')};resetBall();requestAnimationFrame(loop);
