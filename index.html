<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10152f">
<title>TK Game Preview</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0,#343b78,#10152f 55%,#080b1a);color:#fff;display:flex;justify-content:center}
main{width:min(100%,520px);padding:24px 16px 40px}
h1{font-size:28px;margin:4px 0 6px}.sub{color:#c7c9e9;font-size:13px;margin-bottom:22px}.card{display:block;text-decoration:none;color:inherit;padding:18px;border:1px solid #ffffff24;border-radius:18px;background:linear-gradient(145deg,#242a58,#151a38);box-shadow:0 12px 30px #0005;margin-bottom:14px}.card:active{transform:scale(.985)}.title{font-size:20px;font-weight:900}.meta{margin-top:6px;color:#bfc4e8;font-size:12px;line-height:1.6}.play{display:inline-block;margin-top:13px;padding:9px 13px;border-radius:999px;background:#ffe58e;color:#251d38;font-size:12px;font-weight:900}.coming{opacity:.58}.tip{margin-top:24px;padding:14px;border-radius:14px;background:#ffffff0b;border:1px solid #ffffff16;color:#c9cbe4;font-size:12px;line-height:1.7}.tip b{color:#ffe58e}
</style>
</head>
<body>
<main>
<h1>🎮 GAME PREVIEW</h1>
<div class="sub">開発中ゲームのスマホ試遊ページ</div>
<a class="card" href="./starfire-pinball/">
  <div class="title">🔥 星火ピンボール</div>
  <div class="meta">ボス戦つきピンボール。盤面の誘導・演出を改善中。</div>
  <span class="play">Safariで遊ぶ →</span>
</a>
<div class="card coming">
  <div class="title">⭐ STAR CLIMB</div>
  <div class="meta">後でこの一覧に追加予定。</div>
  <span class="play">準備中</span>
</div>
<div class="tip"><b>おすすめ：</b>このページをSafariで開いてブックマークしておくと、今後ChatGPTのリンクを経由せず、ここから各ゲームを直接開けます。</div>
</main>
</body>
</html>
