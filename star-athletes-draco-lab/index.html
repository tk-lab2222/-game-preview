<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO PARTS LAB v3.4</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}.app{max-width:520px;margin:auto;padding:12px 12px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.logo{font-weight:1000}.ver{font-size:11px;background:#294664;color:#fff;padding:5px 8px;border-radius:999px}.stage,.panel{background:#fff;border:1px solid #c9d5e1;border-radius:18px;padding:12px;box-shadow:0 3px 12px #29466412}.heroWrap{display:flex;align-items:center;justify-content:center;min-height:380px}.hero{display:block;max-width:100%;width:320px;height:auto;object-fit:contain}.caption{margin-top:8px;padding:10px 12px;background:#f7fbff;border-radius:14px;font-size:11px;font-weight:800}.panel{margin-top:10px}.row{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f5}.row:last-child{border-bottom:0}.choices{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #aab9ca;background:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;color:#233a58}.chip.on{background:#31587f;color:#fff;border-color:#31587f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:1px solid #aab9ca;background:#fff;border-radius:12px;padding:10px;font-weight:900;color:#233a58}.btn.primary{background:#31587f;color:#fff}.notice{font-size:11px;line-height:1.6;color:#56697c}</style></head><body><div class="app"><div class="top"><div><div class="logo">☆ STAR ATHLETES</div><div style="font-size:11px;font-weight:900">DRACO PARTS LAB</div></div><div class="ver">v3.4</div></div><div class="stage"><div class="heroWrap"><img id="hero" class="hero" src="assets/draco-v34.jpg?v=340" alt="ドラコ全身"></div><div class="caption">高忠実表示テスト：新しい検証済み画像アセット</div></div><div class="panel"><div class="row"><b>体色</b><div class="choices" id="colors"></div></div><div class="row"><b>表情</b><div class="choices"><button class="chip on">通常</button><button class="chip">うれしい</button><button class="chip">やる気</button><button class="chip">しょんぼり</button><button class="chip">つかれ</button></div></div><div class="row"><b>角</b><div class="choices"><button class="chip on">ノーマル</button><button class="chip">カーブ</button><button class="chip">クラウン</button></div></div><div class="row"><b>羽</b><div class="choices"><button class="chip on">ノーマル</button><button class="chip">フェザー</button><button class="chip">クリスタル</button></div></div><div class="row"><b>しっぽ</b><div class="choices"><button class="chip on">ノーマル</button><button class="chip">スター</button><button class="chip">リーフ</button></div></div><div class="row"><b>模様</b><div class="choices"><button class="chip on">なし</button><button class="chip">スター</button><button class="chip">ムーン</button><button class="chip">ハート</button><button class="chip">ライン</button></div></div><div class="row"><b>アクセ</b><div class="choices"><button class="chip on">なし</button><button class="chip">リボン</button><button class="chip">スカーフ</button><button class="chip">ネックレス</button><button class="chip">花</button></div></div></div><div class="actions"><button id="random" class="btn">↝ ランダム個体</button><button id="rare" class="btn primary">☆ レア変異サンプル</button></div><div class="panel"><div class="notice">v3.4では、壊れていた旧画像とHTML埋め込みを廃止し、GitHub Blob APIで登録した新しいJPEGだけを読み込みます。</div></div></div><script>const hero=document.getElementById('hero');const cs=[['基準','none'],['スカイ','hue-rotate(180deg) saturate(.72) brightness(1.04)'],['コーラル','hue-rotate(330deg) saturate(.62) brightness(1.04)'],['ミント','hue-rotate(115deg) saturate(.55) brightness(1.06)'],['ラベンダー','hue-rotate(235deg) saturate(.55) brightness(1.07)'],['クリーム','sepia(.28) saturate(.72) brightness(1.08)']];const box=document.getElementById('colors');cs.forEach(([n,f],i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' on':'');b.textContent=n;b.onclick=()=>{hero.style.filter=f;box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')};box.appendChild(b)});document.querySelectorAll('.row .choices').forEach(g=>g.addEventListener('click',e=>{if(e.target.classList.contains('chip')&&g.id!=='colors'){g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on')}}));document.getElementById('random').onclick=()=>{const[,f]=cs[Math.floor(Math.random()*cs.length)];hero.style.filter=f};document.getElementById('rare').onclick=()=>hero.style.filter='sepia(.18) saturate(.9) brightness(1.08) drop-shadow(0 0 8px #ffe480)';</script></body></html>
