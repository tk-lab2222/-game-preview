<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO PARTS LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#f3ecdf;color:#181818;font-family:system-ui,"Hiragino Maru Gothic ProN",sans-serif}.app{max-width:520px;margin:auto;padding:12px 12px 36px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:20px;font-weight:1000}.ver{font-size:10px;font-weight:900;background:#222;color:#fff;border-radius:999px;padding:4px 7px}.note{font-size:10px;opacity:.65;font-weight:800}.stage{margin:10px 0;background:#fffaf0;border:2px solid #222;border-radius:20px;box-shadow:0 5px #0002;padding:10px}.stage svg{width:100%;display:block}.panel{background:#fffdf8;border:2px solid #222;border-radius:16px;padding:10px;margin:10px 0;box-shadow:0 4px #0002}.panel h3{font-size:14px;margin:0 0 8px}.row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;margin:8px 0}.row b{font-size:11px}.choices{display:flex;gap:5px;flex-wrap:wrap}.choice{border:2px solid #222;border-radius:999px;background:#fff;padding:5px 8px;font-size:10px;font-weight:900}.choice.on{background:#ffd85c}.sw{width:25px;height:25px;border-radius:50%;border:2px solid #222;padding:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:2px solid #222;border-radius:13px;padding:10px;background:#222;color:#fff;font-weight:1000;box-shadow:0 3px #0003}.btn.yellow{background:#ffd85c;color:#302700}.spec{font-size:10px;line-height:1.6;font-weight:800}.chip{display:inline-block;padding:3px 6px;border:1.5px solid #222;border-radius:999px;background:#fff;margin:2px}.rare{background:linear-gradient(90deg,#fff2a8,#f6d5ff,#d2f4ff)}</style></head><body><div class="app"><div class="head"><div><div class="title">DRACO PARTS LAB</div><div class="note">同一座標レイヤー合成テスト</div></div><div class="ver">v1.0</div></div><div class="stage"><svg viewBox="0 0 512 512" aria <!-- horns --> <g id="horn-small"><path d="M190 78l19-44 22 50" fill="var(--sub)" stroke="#38242a" stroke-width="6"/><path d="M281 84l25-46 17 56" fill="var(--sub)" stroke="#38242a" stroke-width="6"/></g><g id="horn-round" style="display:none"><path d="M188 83q7-53 39-34 9 8-4 24z" fill="#ffd178" stroke="#38242a" stroke-width="6"/><path d="M286 83q-7-53 39-34 9 8-4 24z" fill="#ffd178" stroke="#38242a" stroke-width="6"/></g><g id="horn-long" style="display:none"><path d="M183 84l20-70 30 69" fill="#ffe89b" stroke="#38242a" stroke-width="6"/><path d="M280 84l29-70 24 79" fill="#ffe89b" stroke="#38242a" stroke-width="6"/></g>
<!-- pattern overlay --> <g id="pat-none"></g><g id="pat-spots" style="display:none" fill="var(--pattern)" opacity=".8"><circle cx="188" cy="339" r="15"/><circle cx="326" cy="365" r="18"/><circle cx="286" cy="405" r="10"/><circle cx="219" cy="397" r="12"/></g><g id="pat-flame" style="display:none" fill="var(--pattern)" opacity=".85"><path d="M177 376c35-14 17-45 42-62-3 22 20 28 13 57-6 26-38 35-55 5z"/><path d="M294 387c28-12 14-36 34-51-2 19 16 22 10 46-5 21-31 29-44 5z"/></g><g id="pat-stripe" style="display:none" stroke="var(--pattern)" stroke-width="14" opacity=".72"><path d="M171 353l48 16"/><path d="M291 346l52 18"/><path d="M182 390l44 13"/></g><g id="pat-star" style="display:none" fill="#ffe46b"><path d="M180 364l8 16 18 3-13 12 3 18-16-8-16 8 3-18-13-12 18-3z"/><path d="M322 340l6 12 14 2-10 9 2 14-12-7-12 7 2-14-10-9 14-2z"/></g>
<!-- accessory --> <g id="acc-none"></g><g id="acc-goggles" style="display:none"><circle cx="212" cy="113" r="24" fill="#8ad8ff" stroke="#5d391f" stroke-width="8"/><circle cx="300" cy="113" r="24" fill="#8ad8ff" stroke="#5d391f" stroke-width="8"/><path d="M236 113h40" stroke="#5d391f" stroke-width="8"/></g><g id="acc-crown" style="display:none"><path d="M218 74l16-42 22 24 20-30 18 48z" fill="#ffd33d" stroke="#6d4b16" stroke-width="6"/></g><g id="acc-ribbon" style="display:none"><path d="M343 116q30-34 49 1-25 13-47 12 17 18-6 38-15-22 4-51z" fill="#e9465d" stroke="#652836" stroke-width="5"/></g></g></svg></div><div class="panel"><h3>色</h3><div class="row"><b>メイン体色</b><div class="choices" id="mainColors"></div></div><div class="row"><b>サブ色</b><div class="choices" id="subColors"></div></div><div class="row"><b>目色</b><div class="choices" id="eyeColors"></div></div><div class="row"><b>模様色</b><div class="choices" id="patternColors"></div></div></div><div class="panel"><h3>パーツ</h3><div class="row"><b>表情</b><div class="choices" data-k="expression"></div></div><div class="row"><b>角</b><div class="choices" data-k="horn"></div></div><div class="row"><b>羽</b><div class="choices" data-k="wing"></div></div><div class="row"><b>しっぽ</b><div class="choices" data-k="tail"></div></div><div class="row"><b>模様</b><div class="choices" data-k="pattern"></div></div><div class="row"><b>アクセ</b><div class="choices" data-k="accessory"></div></div></div><div class="actions"><button class="btn yellow" id="random">🎲 ランダム個体</button><button class="btn" id="rare">✨ レア変異サンプル</button></div><div class="panel"><h3>現在の個体</h3><div id="spec" class="spec"></div></div></div><script>const root=document.documentElement;const state={main:'#ff684f',sub:'#7f3f52',eye:'#d94a35',pattern:'#8f4350',expression:'通常',horn:'小角',wing:'小羽',tail:'丸尾',patternType:'なし',accessory:'なし'};const colors={main:[['赤','#ff684f'],['青','#4f91ef'],['緑','#64b96a'],['黄','#f4bb4c'],['紫','#8d67d7'],['白','#e9eef3']],sub:[['濃赤','#7f3f52'],['紺','#344d81'],['深緑','#376b49'],['金','#d89c2f'],['濃紫','#57436f']],eye:[['赤','#d94a35'],['青','#347cd8'],['緑','#2eaa63'],['金','#dca934'],['紫','#7d4cca']],pattern:[['濃赤','#8f4350'],['青','#3d6fc7'],['緑','#42845a'],['金','#d49925'],['紫','#69478e']]};const opts={expression:['通常','うれしい','やる気','しょんぼり'],horn:['小角','丸角','長角'],wing:['小羽','丸羽','とがり羽'],tail:['丸尾','炎尾','星尾'],pattern:['なし','斑点','炎','縞','星'],accessory:['なし','ゴーグル','王冠','リボン']};function mkColors(key,id){let box=document.getElementById(id);colors[key].forEach(([n,v],i)=>{let b=document.createElement('button');b.className='sw'+(i===0?' on':'');b.style.background=v;b.title=n;b.onclick=()=>{state[key]=v;box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw()};box.appendChild(b)})}mkColors('main','mainColors');mkColors('sub','subColors');mkColors('eye','eyeColors');mkColors('pattern','patternColors');document.querySelectorAll('[data-k]').forEach(box=>{let k=box.dataset.k;opts[k].forEach((n,i)=>{let b=document.createElement('button');b.className='choice'+(i===0?' on':'');b.textContent=n;b.onclick=()=>{if(k==='pattern')state.patternType=n;else state[k]=n;box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw()};box.appendChild(b)})});function only(prefix,val,map){Object.values(map).forEach(id=>{let e=document.getElementById(id);if(e)e.style.display='none'});let id=map[val];if(id)document.getElementById(id).style.display=''}const maps={expr:{'通常':'eyes-normal|mouth-smile','うれしい':'eyes-happy|mouth-smile','やる気':'eyes-drive|mouth-smile','しょんぼり':'eyes-normal|mouth-sad'},horn:{'小角':'horn-small','丸角':'horn-round','長角':'horn-long'},wing:{'小羽':'wing-small','丸羽':'wing-round','とがり羽':'wing-point'},tail:{'丸尾':'tail-normal','炎尾':'tail-flame','星尾':'tail-star'},pattern:{'なし':'pat-none','斑点':'pat-spots','炎':'pat-flame','縞':'pat-stripe','星':'pat-star'},accessory:{'なし':'acc-none','ゴーグル':'acc-goggles','王冠':'acc-crown','リボン':'acc-ribbon'}};function showMap(map,val){Object.values(map).flatMap(x=>x.split('|')).forEach(id=>{let e=document.getElementById(id);if(e)e.style.display='none'});(map[val]||'').split('|').forEach(id=>{let e=document.getElementById(id);if(e)e.style.display=''})}function draw(){root.style.setProperty('--main',state.main);root.style.setProperty('--sub',state.sub);root.style.setProperty('--eye',state.eye);root.style.setProperty('--pattern',state.pattern);showMap(maps.expr,state.expression);showMap(maps.horn,state.horn);showMap(maps.wing,state.wing);showMap(maps.tail,state.tail);showMap(maps.pattern,state.patternType);showMap(maps.accessory,state.accessory);document.getElementById('spec').innerHTML=`<span class="chip">表情 ${state.expression}</span><span class="chip">角 ${state.horn}</span><span class="chip">羽 ${state.wing}</span><span class="chip">しっぽ ${state.tail}</span><span class="chip">模様 ${state.patternType}</span><span class="chip">アクセ ${state.accessory}</span>`}function rand(a){return a[Math.floor(Math.random()*a.length)]}document.getElementById('random').onclick=()=>{state.main=rand(colors.main)[1];state.sub=rand(colors.sub)[1];state.eye=rand(colors.eye)[1];state.pattern=rand(colors.pattern)[1];state.expression=rand(opts.expression);state.horn=rand(opts.horn);state.wing=rand(opts.wing);state.tail=rand(opts.tail);state.patternType=rand(opts.pattern);state.accessory=rand(opts.accessory);draw()};document.getElementById('rare').onclick=()=>{state.main='#f3d15f';state.sub='#fff0ad';state.eye='#65c8ff';state.pattern='#fff5ba';state.expression='やる気';state.horn='長角';state.wing='とがり羽';state.tail='星尾';state.patternType='星';state.accessory='王冠';draw();document.getElementById('spec').classList.add('rare')};draw();</script></body></html>
