込み</div></div><div class="panel"><div class="row"><b>体色</b><div class="choices" id="colors"></div></div><div class="row"><b>表情</b><div class="choices"><button class="chip on">通常</button><button class="chip">うれしい</button><button class="chip">やる気</button><button class="chip">しょんぼり</button><button class="chip">つかれ</button></div></div><div class="row"><b>角</b><div class="choices"><button class="chip on">ノーマル</button><button class="chip">カーブ</button><button class="chip">クラウン</button></div></div><div class="row"><b>羽</b><div class="choices"><button class="chip on">ノーマル</button><button class="chip">フェザー</button><button class="chip">クリスタル</button></div></div><div class="row"><b>しっぽ</b><div class="choices"><button class="chip on">ノーマル</button><button class="chip">スター</button><button class="chip">リーフ</button></div></div><div class="row"><b>模様</b><div class="choices"><button class="chip on">なし</button><button class="chip">スター</button><button class="chip">ムーン</button><button class="chip">ハート</button><button class="chip">ライン</button></div></div><div class="row"><b>アクセ</b><div class="choices"><button class="chip on">なし</button><button class="chip">リボン</button><button class="chip">スカーフ</button><button class="chip">ネックレス</button><button class="chip">花</button></div></div></div><div class="actions"><button id="random" class="btn">↝ ランダム個体</button><button id="rare" class="btn primary">☆ レア変異サンプル</button></div><div class="panel"><div class="notice">v3.3は外部画像ファイルを使わず、正常な全身画像をHTMLへ直接埋め込んでいます。これでGitHub Pages上の画像破損経路を切り分けます。</div></div></div><script>const hero=document.getElementById('hero');const cs=[['基準','none'],['スカイ','hue-rotate(180deg) saturate(.72) brightness(1.04)'],['コーラル','hue-rotate(330deg) saturate(.62) brightness(1.04)'],['ミント','hue-rotate(115deg) saturate(.55) brightness(1.06)'],['ラベンダー','hue-rotate(235deg) saturate(.55) brightness(1.07)'],['クリーム','sepia(.28) saturate(.72) brightness(1.08)']];const box=document.getElementById('colors');cs.forEach(([n,f],i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' on':'');b.textContent=n;b.onclick=()=>{hero.style.filter=f;box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')};box.appendChild(b)});document.querySelectorAll('.row .choices').forEach(g=>g.addEventListener('click',e=>{if(e.target.classList.contains('chip')&&g.id!=='colors'){g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on')}}));document.getElementById('random').onclick=()=>{const [,f]=cs[Math.floor(Math.random()*cs.length)];hero.style.filter=f;hero.style.transform='scale(.985)';setTimeout(()=>hero.style.transform='',180)};document.getElementById('rare').onclick=()=>{hero.style.filter='sepia(.18) saturate(.9) brightness(1.08) drop-shadow(0 0 8px #ffe480)';hero.style.transform='scale(1.01)';setTimeout(()=>hero.style.transform='',220)};</script></body></html>
