<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO LAB v4.0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}main{max-width:520px;margin:auto;padding:12px 12px 32px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0;font-weight:1000;line-height:1}.sub{font-size:12px;font-weight:900;margin-top:5px}.ver{background:#294664;color:#fff;border-radius:999px;padding:8px 12px}.card{margin-top:10px;background:#fff;border:1px solid #c8d5e2;border-radius:18px;padding:12px;box-shadow:0 3px 12px #29466412}.stage{min-height:410px;display:grid;place-items:center;background:linear-gradient(#f7fbff,#eef6fd);border-radius:15px;overflow:hidden;position:relative}canvas{display:block;width:min(100%,360px);height:auto}.status{position:absolute;left:10px;top:10px;font-size:10px;font-weight:900;background:#ffffffdd;border-radius:999px;padding:6px 9px}.cap{margin-top:9px;background:#f7fbff;border-radius:13px;padding:9px 11px;font-size:11px;font-weight:800}.row{display:grid;grid-template-columns:66px 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f5}.row:last-child{border:0}.row b{font-size:12px}.opts{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #aab9ca;background:#fff;color:#233a58;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850}button.on{background:#31587f;color:#fff;border-color:#31587f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{border-radius:12px;padding:11px}.note{font-size:11px;line-height:1.6;color:#5a6c7f}.err{color:#b13838}</style></head><body><main><header><div><h1>☆ STAR ATHLETES</h1><div class="sub">DRACO PARTS LAB</div></div><div class="ver">v4.0.1</div></header><section class="card"><div class="stage"><div id="status" class="status">アトラス読込中…</div><canvas id="cv" width="360" height="430"></canvas></div><div class="cap">Canvas＋Sprite Atlas パイロット。承認済みドラコ素材を分割データから復元して描画。</div></section><section class="card"><div class="row"><b>表情</b><div class="opts" data-key="face"><button class="on" data-v="0">通常</button><button data-v="1">うれしい</button><button data-v="2">やる気</button><button data-v="3">しょんぼり</button><button data-v="4">つかれ</button></div></div><div class="row"><b>角</b><div class="opts" data-key="horn"><button class="on" data-v="0">ノーマル</button><button data-v="1">カール</button><button data-v="2">クリスタル</button></div></div><div class="row"><b>羽</b><div class="opts" data-key="wing"><button class="on" data-v="0">ノーマル</button><button data-v="1">フェザー</button><button data-v="2">クリスタル</button></div></div><div class="row"><b>しっぽ</b><div class="opts" data-key="tail"><button class="on" data-v="0">ノーマル</button><button data-v="1">スター</button><button data-v="2">リーフ</button></div></div></section><div class="actions"><button id="reset">基準に戻す</button><button id="random" class="on">↝ ランダム個体</button></div><section class="card"><div class="note">v4では一枚絵をHTMLに直埋めせず、GitHub上の分割アトラスをブラウザで復元しCanvasへ描いています。まず表示安定性と元デザイン維持を確認し、その後に体色・模様・アクセ・配合遺伝へ接続します。</div></section></main><script>const C=document.getElementById('cv'),X=C.getContext('2d'),S={face:0,horn:0,wing:0,tail:0};let base,parts;const $=s=>document.querySelector(s);function normalizeBase64(s){s=s.replace(/-/g,'+').replace(/_/g,'/').replace(/[^A-Za-z0-9+/=]/g,'');const firstPad=s.indexOf('=');if(firstPad>=0)s=s.slice(0,firstPad);while(s.length%4)s+='=';return s}async function atlas(dir,n){let a='';for(let i=0;i<n;i++){const r=await fetch(`assets-v4/${dir}/${String(i).padStart(2,'0')}.txt?v=401`);if(!r.ok)throw Error(`${dir}/${i} ${r.status}`);a+=await r.text()}a=normalizeBase64(a);if(!a.length)throw Error(`${dir}: empty`);let b=atob(a),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const blob=new Blob([u],{type:'image/webp'}),url=URL.createObjectURL(blob),im=new Image;await new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(new Error(`${dir}: image decode`));im.src=url});URL.revokeObjectURL(url);return im}function d(img,sx,sy,sw,sh,dx,dy,dw,dh){X.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh)}function render(){if(!base||!parts)return;X.clearRect(0,0,360,430);X.fillStyle='#f3f8fd';X.fillRect(0,0,360,430);d(base,0,80,315,368,22,28,316,370);if(S.face>0){const sx=S.face*80;d(base,sx,0,80,80,160,112,88,88)}if(S.horn>0)d(parts,S.horn*133,0,133,95,115,32,145,104);if(S.wing>0)d(parts,S.wing*133,95,133,115,20,135,150,130);if(S.tail>0)d(parts,S.tail*133,205,133,115,24,274,145,125)}function sync(){document.querySelectorAll('.opts').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S[g.dataset.key])))}document.querySelectorAll('.opts').forEach(g=>g.onclick=e=>{if(!e.target.matches('button[data-v]'))return;S[g.dataset.key]=+e.target.dataset.v;sync();render()});$('#reset').onclick=()=>{Object.assign(S,{face:0,horn:0,wing:0,tail:0});sync();render()};$('#random').onclick=()=>{S.face=Math.floor(Math.random()*5);S.horn=Math.floor(Math.random()*3);S.wing=Math.floor(Math.random()*3);S.tail=Math.floor(Math.random()*3);sync();render()};(async()=>{try{[base,parts]=await Promise.all([atlas('base',7),atlas('parts',2)]);$('#status').textContent=`Atlas OK ${base.naturalWidth}×${base.naturalHeight} / ${parts.naturalWidth}×${parts.naturalHeight}`;render()}catch(e){$('#status').classList.add('err');$('#status').textContent='読込失敗: '+e.message;console.error(e)}})();</script></body></html>
