<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO PARTS LAB v3.1</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17243a;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}.app{max-width:520px;margin:auto;padding:12px 12px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.logo{font-weight:1000;letter-spacing:.03em}.ver{font-size:11px;background:#294664;color:#fff;padding:5px 8px;border-radius:999px}.stage{background:linear-gradient(#dff1ff,#f7fbff);border:1px solid #b6c5d6;border-radius:18px;box-shadow:0 5px 18px #385a7b22;padding:10px;display:flex;flex-direction:column;align-items:center}.hero{display:block;width:auto;max-width:100%;height:auto;max-height:68vh;object-fit:contain;object-position:center;transition:.2s filter,.2s transform}.caption{width:100%;margin-top:8px;padding:8px 10px;background:#ffffffdc;border-radius:10px;font-size:11px;font-weight:800}.panel{margin-top:10px;background:#fff;border:1px solid #c9d5e1;border-radius:15px;padding:10px;box-shadow:0 3px 12px #29466412}.row{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f5}.row:last-child{border-bottom:0}.row b{font-size:12px}.choices{display:flex;gap:6px;flex-wrap:wrap}.btn,.chip{border:1px solid #aab9ca;background:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;color:#233a58}.chip.on{background:#31587f;color:#fff;border-color:#31587f}.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #9fb0c3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border-radius:12px;padding:10px}.btn.primary{background:#31587f;color:#fff}.notice{font-size:11px;line-height:1.6;color:#56697c;margin-top:8px}.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.sample{aspect-ratio:1/1.2;border-radius:10px;background:#f8fbfd;border:1px solid #d4dee8;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900}.sample:nth-child(1){background:#fff0f2}.sample:nth-child(2){background:#eef6ff}.sample:nth-child(3){background:#effbf5}.sample:nth-child(4){background:#f6f0ff}.sample:nth-child(5){background:#fff7e8}@media(max-height:700px){.hero{max-height:58vh}}</style></head><body><div class="app"><div class="top"><div><div class="logo">☆ STAR ATHLETES</div><div style="font-size:11px;font-weight:900">DRACO PARTS LAB</div></div><div class="ver">v3.1</div></div><div class="stage"><img id="hero" class="hero" src="assets/draco-v3.jpg?v=310" alt="ドラコ全身"><div class="caption">高忠実表示テスト：全身が必ず収まる表示に修正</div></div><div class="panel"><div class="row"><b>体色</b><div class="choices" id="colors"></div></div><div class="row"><b>表情</b><div class="choices"><button class="chip on">通常</button><button class="chip">うれしい</button><button class="chip">やる気</button><button class="chip">しょんぼり</button><button class="chip">つかれ</button></div></div><div class="row"><b>角</b><div class="choices"><button class="chip on">ノーマル</button><button class="chip">カーブ</button><button class="chip">クラウン</button></div></div><div class="row"><b>羽</b><div class="choices"><button class="chip on">ノーマル</button><button class="chip">フェザー</button><button class="chip">クリスタル</button></div></div><div class="row"><b>しっぽ</b><div class="choices"><button class="chip on">ノーマル</button><button class="chip">スター</button><button class="chip">リーフ</button></div></div><div class="row"><b>模様</b><div class="choices"><button class="chip on">なし</button><button class="chip">スター</button><button class="chip">ムーン</button><button class="chip">ハート</button><button class="chip">ライン</button></div></div><div class="row"><b>アクセ</b><div class="choices"><button class="chip on">なし</button><button class="chip">リボン</button><button class="chip">スカーフ</button><button class="chip">ネックレス</button><button class="chip">花</button></div></div></div><div class="actions"><button id="random" class="btn">↝ ランダム個体</button><button id="rare" class="btn primary">☆ レア変異サンプル</button></div><div class="panel"><b style="font-size:12px">ギャラリーイメージ</b><div class="gallery"><div class="sample">コーラル</div><div class="sample">スカイ</div><div class="sample">ミント</div><div class="sample">ラベンダー</div><div class="sample">クリーム</div></div><div class="notice">v3.1は元デザインの完成度を壊さず、スマホでもドラコ全身が必ず見えるよう表示方式を調整しています。</div></div></div><script>const hero=document.getElementById('hero');const cs=[['基準','none'],['スカイ','hue-rotate(180deg) saturate(.72) brightness(1.04)'],['コーラル','hue-rotate(330deg) saturate(.62) brightness(1.04)'],['ミント','hue-rotate(115deg) saturate(.55) brightness(1.06)'],['ラベンダー','hue-rotate(235deg) saturate(.55) brightness(1.07)'],['クリーム','sepia(.28) saturate(.72) brightness(1.08)']];const box=document.getElementById('colors');cs.forEach(([n,f],i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' on':'');b.textContent=n;b.onclick=()=>{hero.style.filter=f;box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')};box.appendChild(b)});document.querySelectorAll('.row .choices').forEach(g=>g.addEventListener('click',e=>{if(e.target.classList.contains('chip')&&g.id!=='colors'){g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on')}}));document.getElementById('random').onclick=()=>{const [n,f]=cs[Math.floor(Math.random()*cs.length)];hero.style.filter=f;hero.style.transform='scale(.985)';setTimeout(()=>hero.style.transform='',180)};document.getElementById('rare').onclick=()=>{hero.style.filter='sepia(.18) saturate(.9) brightness(1.08) drop-shadow(0 0 8px #ffe480)';hero.style.transform='scale(1.01)';setTimeout(()=>hero.style.transform='',220)};</script></body></html>
