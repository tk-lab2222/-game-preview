<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>らくがきダッシュ v0.11</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e8;color:#283b36;font-family:system-ui,sans-serif}main{max-width:820px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:5px 0;font-size:26px}.tag{font-size:11px;letter-spacing:2px;color:#718071}#clock{font:bold 30px monospace;background:#def3a2;padding:9px 16px;border-radius:18px}p{font-size:13px;line-height:1.8}canvas{display:block;width:100%;background:#fffdf8;border:1px solid #d7d9cd;border-radius:22px;touch-action:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}button{padding:12px 15px;border:1px solid #cbd2c6;border-radius:14px;background:#fffdf8;color:#283b36;font-weight:700;cursor:pointer;touch-action:manipulation}.primary{background:#ddf78e;border-color:#a5bd64}button:disabled{opacity:.4}button.active{background:#283b36;color:white}input[type=color]{width:44px;height:38px;border:0;background:none}#race,#after{display:none}#message{min-height:28px;font-weight:700}details{font-size:12px;line-height:1.8;margin:20px 0;color:#65776b}.samples button{font-size:12px;padding:9px}.muted{color:#708073;font-size:12px}.personality{display:none;margin:10px 0;padding:12px 14px;border-radius:16px;background:#fffdf8;border:1px solid #d7d9cd;font-size:13px;font-weight:750}.reaction{font-weight:900;font-size:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.stat{background:#f2f5e9;border-radius:10px;padding:7px;text-align:center;font-size:11px}.stat b{display:block;font-size:15px}.movebadge{display:none;padding:7px 11px;border-radius:999px;background:#fffdf8;border:1px solid #cbd2c6;font-size:12px;font-weight:800}@media(max-width:500px){main{padding:12px}h1{font-size:23px}button{padding:11px}.tag{letter-spacing:1px}}</style><main><header><div><div class="tag">DRAW → WAKE UP → RACE</div><h1>らくがきダッシュ <span style="font-size:12px;font-weight:800;color:#718071;vertical-align:middle">v0.11</span></h1></div><div id="clock">30</div></header><p id="intro">30秒で、自由に生き物を描こう。どんな走り方になる？</p><div id="drawing"><canvas id="paper" width="600" height="440"></canvas><div class="row"><button id="begin" class="primary">30秒スタート</button><button id="done">描けた！</button><input id="color" type="color" value="#34413d"><button id="erase">消しゴム</button><button id="undo">戻す</button><button id="clear">消す</button></div><div class="row samples"><span class="muted">すぐ試す：</span><button data-s="0">人型</button><button data-s="1">まる</button><button data-s="2">多足</button><button data-s="3">左右非対称</button><button data-s="4">ぐちゃぐちゃ</button></div></div><div id="race"><canvas id="track" width="800" height="470"></canvas><div class="row"><button id="pause">一時停止</button><button id="bones">推定を見る</button><label><input type="checkbox" id="slow">ゆっくり</label><span id="movebadge" class="movebadge"></span></div></div><div id="message">最初の一筆からでもタイマーが始まります。</div><div id="personality" class="personality"></div><div id="after" class="row"><button id="again" class="primary">もう一度描く</button><button id="replay">同じ絵でもう一走</button><button id="challenge">ヒントで描き直す</button></div></main><script>
'use strict';const $=id=>document.getElementById(id),paper=$('paper'),pg=paper.getContext('2d'),track=$('track'),tg=track.getContext('2d');let strokes=[],active=null,erasing=false,state='ready',deadline=0,rig=null,raceTime=0,last=0,paused=false,debug=false,bestTime=Number(localStorage.getItem('doodleBest')||0),runs=Number(localStorage.getItem('doodleRuns')||0);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hypot=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function paint(g,ss,map=null){g.lineCap='round';g.lineJoin='round';for(let s of ss){g.strokeStyle=s.c;g.lineWidth=s.w;g.beginPath();s.p.forEach((p,i)=>{let q=map?map(p):p;i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y)});g.stroke()}}
function drawPaper(){pg.clearRect(0,0,600,440);paint(pg,strokes);if(!strokes.length){pg.fillStyle='#9aa391';pg.textAlign='center';pg.font='17px system-ui';pg.fillText('ここに、あなたの生き物を。',300,210);pg.font='12px system-ui';pg.fillText('線も色も、そのまま走り出す',300,237)}}
function start(){if(state==='ready'){state='draw';deadline=performance.now()+30000;$('begin').disabled=true;$('message').textContent='上手でなくてOK。1体、好きに描いてみよう。'}}
function pos(e){let b=paper.getBoundingClientRect();return{x:clamp((e.clientX-b.left)*600/b.width,0,600),y:clamp((e.clientY-b.top)*440/b.height,0,440)}}function eraseAt(q){strokes=strokes.filter(s=>!s.p.some(p=>hypot(p,q)<22));drawPaper()}
paper.onpointerdown=e=>{if(state!=='ready'&&state!=='draw')return;start();paper.setPointerCapture(e.pointerId);let q=pos(e);if(erasing){active={erase:true};eraseAt(q)}else{active={c:$('color').value,w:7,p:[q,{x:q.x+.01,y:q.y}]};strokes.push(active);drawPaper()}};paper.onpointermove=e=>{if(!active||state!=='draw')return;let q=pos(e);if(active.erase)eraseAt(q);else if(hypot(active.p.at(-1),q)>2&&active.p.length<1800){active.p.push(q);drawPaper()}};paper.onpointerup=paper.onpointercancel=()=>active=null;$('begin').onclick=start;$('erase').onclick=()=>{erasing=!erasing;$('erase').classList.toggle('active',erasing)};$('undo').onclick=()=>{strokes.pop();drawPaper()};$('clear').onclick=()=>{strokes=[];drawPaper()};
function analyze(input){let pts=input.flatMap(s=>s.p),xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),w=Math.max(12,x1-x0),h=Math.max(12,y1-y0),scale=180/Math.max(w,h);let ss=input.map(s=>({c:s.c,w:s.w*scale,p:s.p.map(p=>({x:(p.x-(x0+x1)/2)*scale,y:(p.y-y1)*scale}))}));w*=scale;h*=scale;let center={x:0,y:-h*.53},feet=[];for(let s of ss){if(s.p.length<3)continue;let a=s.p[0],b=s.p.at(-1);if(hypot(a,b)<Math.max(12,w*.12))continue;for(let q of[a,b]){let o=q===a?b:a;if(q.y>-h*.4&&o.y<q.y-h*.1)feet.push({...q})}}feet.sort((a,b)=>a.x-b.x);feet=feet.filter((p,i,a)=>!a.slice(0,i).some(q=>hypot(p,q)<Math.max(15,w*.15))).slice(0,6);if(feet.length<2)feet=[];let limbs=feet.map((foot,i)=>{let hip={x:clamp(foot.x*.32,-w*.23,w*.23),y:center.y+h*.12},knee={x:hip.x*.5+foot.x*.5+(i%2?1:-1)*8,y:(hip.y+foot.y)/2};return{hip,knee,foot,phase:i*Math.PI*2/feet.length,len:hypot(hip,knee)+hypot(knee,foot)}});return{ss,limbs,w,h,center,speed:feet.length?clamp(39+limbs.reduce((s,l)=>s+l.len,0)/limbs.length*.27,40,78):48}}
function chooseMotion(r){let legs=r.limbs.length,ratio=r.w/r.h,points=r.ss.reduce((n,s)=>n+s.p.length,0),density=points/(r.w*r.h)*1000;if(legs>=2)return{id:'run',label:'はしる！',speedMul:1};if(ratio>1.45)return{id:'roll',label:'ころころ！',speedMul:.94};if(ratio<.72)return{id:'hop',label:'ぴょんぴょん！',speedMul:.9};if(density>1.15||r.ss.length>=5)return{id:'wiggle',label:'うねうね！',speedMul:.88};return{id:'hop',label:'ぴょんぴょん！',speedMul:.9}}
function applyMotion(r){r.motion=chooseMotion(r);let legs=r.limbs.length,ratio=r.w/r.h,points=r.ss.reduce((n,s)=>n+s.p.length,0),complexity=Math.min(1,(points/180+r.ss.length/12)/2),avgLeg=legs?r.limbs.reduce((a,l)=>a+l.len,0)/legs:r.h*.22;r.personality={tempo:clamp(1.16-(avgLeg/r.h)*.42+legs*.035,.72,1.42),stride:clamp(.82+(avgLeg/r.h)*1.15,.75,1.38),bounce:clamp(1.22-ratio*.18+(legs===0?.18:0),.72,1.5),sway:clamp(.72+complexity*.7+(ratio>1.4?.15:0),.65,1.5),chaos:complexity};r.ability={speed:Math.round(clamp(48+r.personality.stride*25+r.personality.tempo*12,35,99)),jump:Math.round(clamp(35+r.personality.bounce*38,25,99)),stable:Math.round(clamp(42+Math.min(6,legs)*7-complexity*13,25,99)),weird:Math.round(clamp(30+complexity*55+r.personality.sway*10,20,99))};r.speed=Math.max(34,r.speed*r.motion.speedMul*(.88+r.ability.speed/500+r.ability.stable/900));return r}
function render(g,r,t,x,y,size,isPlayer=false){if(!r||!r.ss||!r.ss.length)return;let P=r.personality||{tempo:1,bounce:1,sway:1},ph=t*6.2*(P.tempo||1),oy=0,rot=0;if(r.motion&&r.motion.id==='hop')oy=-Math.abs(Math.sin(ph))*20*(P.bounce||1);if(r.motion&&r.motion.id==='roll')rot=Math.sin(ph*.55)*.2*(P.sway||1);if(r.motion&&r.motion.id==='wiggle')rot=Math.sin(ph)*.1*(P.sway||1);if(r.limbs&&r.limbs.length)oy+=Math.sin(ph*2)*3;let cs=Math.cos(rot),sn=Math.sin(rot);const map=p=>{let px=p.x*size,py=p.y*size;return{x:x+px*cs-py*sn,y:y+px*sn+py*cs+oy}};if(isPlayer){g.save();g.globalAlpha=.35;for(let s of r.ss){g.strokeStyle='#fff';g.lineWidth=Math.max(14,s.w*size+12);g.lineCap='round';g.lineJoin='round';g.beginPath();s.p.forEach((p,i)=>{let q=map(p);i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y)});g.stroke()}g.restore()}g.save();for(let s of r.ss){g.strokeStyle=s.c||'#283b36';g.lineWidth=Math.max(3,s.w*size);g.lineCap='round';g.lineJoin='round';g.beginPath();s.p.forEach((p,i)=>{let q=map(p);i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y)});g.stroke()}g.restore()}
function finishDrawing(){if(!strokes.length)return;runs++;localStorage.setItem('doodleRuns',runs);rig=applyMotion(analyze(strokes));raceTime=0;state='wake';$('drawing').style.display='none';$('race').style.display='block';$('clock').textContent='！';let P=rig.personality,trait=P.tempo>1.18?'せっかち':P.stride>1.16?'大また':P.bounce>1.2?'よく跳ねる':P.sway>1.12?'くねくね':'マイペース';rig.trait=trait;$('movebadge').textContent=rig.motion.label;$('movebadge').style.display='inline-block';let A=rig.ability,pc=$('personality');pc.style.display='block';pc.innerHTML='この子のクセ：<b>'+trait+'</b> ／ 走法：<b>'+rig.motion.label.replace('！','')+'</b><div class="stats"><div class="stat">スピード<b>'+A.speed+'</b></div><div class="stat">ジャンプ<b>'+A.jump+'</b></div><div class="stat">安定<b>'+A.stable+'</b></div><div class="stat">クセ<b>'+A.weird+'</b></div></div><span class="muted">描き方が能力になる。次は形を変えて記録を狙おう。</span>';rivals=[applyMotion(analyze(sample(0))),applyMotion(analyze(sample(2)))];last=0}
$('done').onclick=finishDrawing;function raceRender(){let g=tg;g.clearRect(0,0,800,470);g.fillStyle='#eaf0e2';g.fillRect(0,0,800,470);if(state==='wake'){g.fillStyle='#829178';g.textAlign='center';g.font='16px system-ui';g.fillText('＼ らくがき、起動！ ／',400,48);render(g,rig,raceTime,400,345,1.35,true);g.fillText(String(Math.max(1,3-Math.floor(raceTime))),400,424);return}let t=Math.max(0,raceTime-3),distance=Math.min(590,t*rig.speed),camera=Math.max(0,distance-250),finish=710-camera,playerX=clamp(145+distance-camera,145,395);for(let i=0;i<3;i++){let y=175+i*105;g.strokeStyle='#ccd7c4';g.beginPath();g.moveTo(0,y);g.lineTo(800,y);g.stroke()}for(let i=0;i<8;i++){g.fillStyle=i%2?'#fff':'#354c3e';g.fillRect(finish,130+i*30,14,30);g.fillStyle=i%2?'#354c3e':'#fff';g.fillRect(finish+14,130+i*30,14,30)}rivals.forEach((r,i)=>render(g,r,t,120+Math.min(590,t*(i?49:57))-camera,175+i*105,.62));g.save();g.fillStyle='rgba(221,247,142,.55)';g.fillRect(0,330,800,140);g.restore();render(g,rig,t,playerX,425,1.0,true);g.fillStyle='#283b36';g.textAlign='center';g.font='900 13px system-ui';g.fillText('YOU',playerX,458);g.textAlign='start';g.fillStyle='#283b36';g.font='bold 18px system-ui';g.fillText('30秒のらくがき、全力疾走。',23,35)}
function reset(){state='ready';deadline=0;strokes=[];paused=false;$('drawing').style.display='block';$('race').style.display='none';$('after').style.display='none';$('begin').disabled=false;$('clock').textContent='30';$('message').textContent='最初の一筆からでもタイマーが始まります。';$('personality').style.display='none';drawPaper()}$('again').onclick=reset;$('challenge').onclick=reset;$('replay').onclick=()=>{state='ready';finishDrawing()};$('pause').onclick=()=>paused=!paused;
function sample(i){let s=[],line=(p,c='#38413c')=>s.push({c,w:7,p:p.map(([x,y])=>({x,y}))}),oval=(x,y,rx,ry,c='#38413c')=>{let p=[];for(let j=0;j<=64;j++){let a=j/64*Math.PI*2;p.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry])}line(p,c)};if(i===0){oval(300,155,55,65);line([[300,219],[300,278]]);line([[300,276],[270,320],[253,375]]);line([[300,276],[330,322],[344,375]])}else if(i===2){oval(300,190,116,49);for(let j=0;j<6;j++)line([[210+j*36,225],[200+j*39,278],[187+j*43,339]])}else if(i===1)oval(300,240,92,80);else if(i===3){oval(300,200,60,90);line([[300,280],[390,370]])}else{let p=[];for(let j=0;j<150;j++){let a=j*.39,r=30+(j%29)*3;p.push([300+Math.cos(a)*r,240+Math.sin(a)*r])}line(p)}return s}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{strokes=sample(+b.dataset.s);finishDrawing()});
function tick(now){let dt=Math.min(.04,(now-(last||now))/1000);last=now;if(state==='draw'){let left=Math.max(0,(deadline-now)/1000);$('clock').textContent=Math.ceil(left);if(!left)finishDrawing()}if(['wake','run'].includes(state)){if(!paused)raceTime+=dt;if(state==='wake'&&raceTime>=3){state='run';$('clock').textContent='GO'}if(state==='run'&&(raceTime-3)*rig.speed>=590){state='result';$('clock').textContent='🏁';$('after').style.display='flex';let tm=Math.max(.01,raceTime-3),record=!bestTime||tm<bestTime;if(record){bestTime=tm;localStorage.setItem('doodleBest',bestTime)}let A=rig.ability||{},hint=A.stable<55?'足を増やすと安定するかも？':A.speed<70?'足を長くすると速くなるかも？':A.jump>80?'縦長を変えたら走り方も変わる？':'形を大きく変えると別の走法になるかも？';$('message').innerHTML=(record?'🏆 <b>自己ベスト！</b> ':'')+'<b>'+tm.toFixed(2)+'秒</b>　'+hint;let pc=$('personality');if(pc){pc.innerHTML+='<br><span class="muted">挑戦 '+runs+'回'+(bestTime?' ／ BEST '+bestTime.toFixed(2)+'秒':'')+'</span>'}}raceRender()}requestAnimationFrame(tick)}reset();requestAnimationFrame(tick);
</script></html>
