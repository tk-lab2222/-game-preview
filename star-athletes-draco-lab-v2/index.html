<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRACO PARTS LAB v2</title><style>*{box-sizing:border-box}body{margin:0;background:#f2ecdf;color:#1d1b19;font-family:system-ui,"Hiragino Maru Gothic ProN",sans-serif}.app{max-width:520px;margin:auto;padding:12px 12px 34px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:20px;font-weight:1000}.ver{font-size:10px;font-weight:900;background:#222;color:#fff;border-radius:999px;padding:4px 8px}.note{font-size:10px;opacity:.68;font-weight:800}.stage{margin:10px 0;background:#fffaf1;border:2px solid #222;border-radius:20px;box-shadow:0 5px #0002;padding:10px}.stage svg{width:100%;display:block}.panel{background:#fffdf8;border:2px solid #222;border-radius:16px;padding:10px;margin:10px 0;box-shadow:0 4px #0002}.panel h3{font-size:14px;margin:0 0 8px}.row{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;margin:8px 0}.row b{font-size:11px}.choices{display:flex;gap:5px;flex-wrap:wrap}.choice{border:2px solid #222;border-radius:999px;background:#fff;padding:5px 8px;font-size:10px;font-weight:900}.choice.on{background:#ffd85c}.sw{width:26px;height:26px;border-radius:50%;border:2px solid #222;padding:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:2px solid #222;border-radius:13px;padding:10px;background:#222;color:#fff;font-weight:1000;box-shadow:0 3px #0003}.btn.yellow{background:#ffd85c;color:#302700}.spec{font-size:10px;line-height:1.65;font-weight:800}.chip{display:inline-block;padding:3px 6px;border:1.5px solid #222;border-radius:999px;background:#fff;margin:2px}</style></head><body><div class="app"><div class="head"><div><div class="title">DRACO PARTS LAB</div><div class="note">1枚絵感優先・固定ベース＋差分レイヤー</div></div><div class="ver">v2.0</div></div><div class="stage"><svg viewBox="0 0 512 512" aria-label="ドラコ合成プレビュー"><defs><linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1"><stop id="bodyHi" offset="0"/><stop id="bodyMid" offset=".56"/><stop id="bodyLo" offset="1"/></linearGradient><linearGradient id="subGrad" x1="0" y1="0" x2="0" y2="1"><stop id="subHi" offset="0"/><stop id="subMid" offset=".62"/><stop id="subLo" offset="1"/></linearGradient><linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8dd"/><stop offset=".65" stop-color="#f1ddb5"/><stop offset="1" stop-color="#d8bd8e"/></linearGradient><radialGradient id="faceGlow" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5e2431" stop-opacity=".12"/></radialGradient><linearGradient id="wingMem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd99d"/><stop offset="1" stop-color="#f79a65"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-opacity=".16"/></filter><filter id="soft"><feGaussianBlur stdDeviation="4"/></filter></defs><ellipse cx="256" cy="458" rx="126" ry="18" fill="#000" opacity=".09"/><g id="tail-normal"><path d="M179 348C105 360 82 416 140 430c43 10 74-26 94-60" fill="url(#bodyGrad)" stroke="#4b2b32" stroke-width="6"/><path d="M134 405c32 4 58-16 76-42" fill="none" stroke="url(#subGrad)" stroke-width="15" stroke-linecap="round" opacity=".92"/></g><g id="tail-flame" style="display:none"><path d="M179 348C105 360 82 416 140 430c42 9 68-20 82-44" fill="url(#bodyGrad)" stroke="#4b2b32" stroke-width="6"/><path d="M214 390c31-10 38-31 36-48 20 20 22 44-4 64z" fill="#f8b15f" stroke="#4b2b32" stroke-width="5"/></g><g id="tail-star" style="display:none"><path d="M179 348C105 360 82 416 140 430c42 9 68-20 82-44" fill="url(#bodyGrad)" stroke="#4b2b32" stroke-width="6"/><path d="M245 344l9 19 21 3-15 14 4 21-19-10-19 10 4-21-15-14 21-3z" fill="#f7d777" stroke="#4b2b32" stroke-width="5"/></g><g id="wing-small"><path d="M171 256c-52-39-96-27-110 18 30-9 54 7-23 2-32 10-41 25-18 16-39 24-69 24-31 0-52-8-69-24-9-15-18-23-40-25z" fill="#fff1cf" opacity=".96"/><ellipse cx="256" cy="216" rx="74" ry="52" fill="#fff7df" opacity=".25"/><ellipse cx="204" cy="183" rx="34" ry="46" fill="#fff" stroke="#4b2b32" stroke-width="5"/><ellipse cx="308" cy="183" rx="34" ry="46" fill="#fff" stroke="#4b2b32" stroke-width="5"/><g id="eyes-normal"><ellipse cx="210" cy="190" rx="18" ry="29" fill="var(--eye)"/><ellipse cx="302" cy="190" rx="18" ry="29" fill="var(--eye)"/><ellipse cx="210" cy="197" rx="13" ry="19" fill="#3c1720" opacity=".72"/><ellipse cx="302" cy="197" rx="13" ry="19" fill="#3c1720" opacity=".72"/><circle cx="216" cy="179" r="7" fill="#fff"/><circle cx="296" cy="179" r="7" fill="#fff"/></g><g id="eyes-happy" style="display:none"><path d="M177 191q27-34 54 0" fill="none" stroke="#4b2b32" stroke-width="9" stroke-linecap="round"/><path d="M281 191q27-34 54 0" fill="none" stroke="#4b2b32" stroke-width="9" stroke-linecap="round"/></g><g id="eyes-drive" style="display:none"><path d="M177 162l55 16" stroke="#4b2b32" stroke-width="8" stroke-linecap="round"/><path d="M335 162l-55 16" stroke="#4b2b32" stroke-width="8" stroke-linecap="round"/><ellipse cx="208" cy="191" rx="20" ry="28" fill="var(--eye)"/><ellipse cx="304" cy="191" rx="20" ry="28" fill="var(--eye)"/><circle cx="214" cy="181" r="6" fill="#fff"/><circle cx="298" cy="181" r="6" fill="#fff"/></g><circle cx="182" cy="225" r="13" fill="#f7a5a0" opacity=".22" filter="url(#soft)"/><circle cx="330" cy="225" r="13" fill="#f7a5a0" opacity=".22" filter="url(#soft)"/><path d="M249 215q7 5 14 0" fill="none" stroke="#b65b52" stroke-width="3" stroke-linecap="round"/><g id="mouth-smile"><path d="M224 232q32 35 64 0c-7 43-57 48-64 0z" fill="#873544" stroke="#4b2b32" stroke-width="5"/><ellipse cx="256" cy="254" rx="21" ry="12" fill="#f89aa5"/></g><g id="mouth-small" style="display:none"><path d="M238 239q18 13 36 0" fill="none" stroke="#4b2b32" stroke-width="6" stroke-linecap="round"/></g><g id="mouth-sad" style="display:none"><path d="M239 247q17-14 34 0" fill="none" stroke="#4b2b32" stroke-width="6" stroke-linecap="round"/></g><g id="horn-small"><path d="M193 80l18-39 19 44" fill="url(#subGrad)" stroke="#4b2b32" stroke-width="6"/><path d="M281 84l24-41 17 50" fill="url(#subGrad)" stroke="#4b2b32" stroke-width="6"/></g><g id="horn-round" style="display:none"><path d="M189 85q5-48 37-32 9 8-5 24z" fill="#e8c98f" stroke="#4b2b32" stroke-width="6"/><path d="M286 85q-5-48 37-32 9 8-5 24z" fill="#e8c98f" stroke="#4b2b32" stroke-width="6"/></g><g id="horn-long" style="display:none"><path d="M185 86l19-64 28 62" fill="#f1d69a" stroke="#4b2b32" stroke-width="6"/><path d="M281 86l27-64 23 70" fill="#f1d69a" stroke="#4b2b32" stroke-width="6"/></g><g id="pat-none"></g><g id="pat-spots" style="display:none" fill="var(--pattern)" opacity=".62"><circle cx="187" cy="344" r="15"/><circle cx="329" cy="367" r="18"/><circle cx="287" cy="406" r="10"/><circle cx="218" cy="398" r="12"/></g><g id="pat-flame" style="display:none" fill="var(--pattern)" opacity=".68"><path d="M177 380c34-14 17-43 41-59-3 21 19 27 12 54-6 25-37 34-53 5z"/><path d="M295 390c27-11 14-34 33-48-2 18 15 21 10 43-5 20-30 27-43 5z"/></g><g id="pat-stripe" style="display:none" stroke="var(--pattern)" stroke-width="13" opacity=".58"><path d="M172 355l47 15"/><path d="M292 349l51 17"/><path d="M184 391l42 13"/></g><g id="pat-star" style="display:none" fill="#eed279" opacity=".88"><path d="M181 365l8 16 18 3-13 12 3 18-16-8-16 8 3-18-13-12 18-3z"/><path d="M323 341l6 12 14 2-10 9 2 14-12-7-12 7 2-14-10-9 14-2z"/></g><g id="acc-none"></g><g id="acc-goggles" style="display:none"><circle cx="213" cy="116" r="24" fill="#9ad6eb" stroke="#69442f" stroke-width="8"/><circle cx="299" cy="116" r="24" fill="#9ad6eb" stroke="#69442f" stroke-width="8"/><path d="M237 116h38" stroke="#69442f" stroke-width="8"/></g><g id="acc-crown" style="display:none"><path d="M218 77l16-38 22 21 20-27 18 44z" fill="#eecb59" stroke="#7b5a28" stroke-width="6"/></g><g id="acc-ribbon" style="display:none"><path d="M344 118q28-31 46 2-24 12-44 11 15 17-6 36-14-21 4-49z" fill="#d85f71" stroke="#6d3542" stroke-width="5"/></g></g></svg></div><div class="panel"><h3>色</h3><div class="row"><b>メイン体色</b><div class="choices" id="mainColors"></div></div><div class="row"><b>サブ色</b><div class="choices" id="subColors"></div></div><div class="row"><b>目色</b><div class="choices" id="eyeColors"></div></div><div class="row"><b>模様色</b><div class="choices" id="patternColors"></div></div></div><div class="panel"><h3>パーツ</h3><div class="row"><b>表情</b><div class="choices" data-k="expression"></div></div><div class="row"><b>角</b><div class="choices" data-k="horn"></div></div><div class="row"><b>羽</b><div class="choices" data-k="wing"></div></div><div class="row"><b>しっぽ</b><div class="choices" data-k="tail"></div></div><div class="row"><b>模様</b><div class="choices" data-k="pattern"></div></div><div class="row"><b>アクセ</b><div class="choices" data-k="accessory"></div></div></div><div class="actions"><button class="btn yellow" id="random">🎲 ランダム個体</button><button class="btn" id="reset">↩ 標準に戻す</button></div><div class="panel"><h3>現在の個体</h3><div id="spec" class="spec"></div></div></div><script>const state={main:'#e57c68',sub:'#8d6673',eye:'#b9554d',pattern:'#9d6a67',expression:'normal',horn:'small',wing:'small',tail:'normal',patternType:'none',accessory:'none'};const mainPalette=['#e57c68','#7e9db5','#8fa58b','#d8ad6c','#a48eb6','#e2ddd3','#b79266'];const subPalette=['#8d6673','#6e8196','#73856e','#a27d57','#7d6e8d','#8b8681'];const eyePalette=['#b9554d','#58789d','#5e8763','#b48a44','#7a5f91'];const patternPalette=['#9d6a67','#b89a72','#70677f','#7b8f86'];const labels={expression:{normal:'通常',happy:'うれしい',drive:'やる気'},horn:{small:'小角',round:'丸角',long:'長角'},wing:{small:'小羽',round:'丸羽',point:'とがり羽'},tail:{normal:'丸尾',flame:'炎尾',star:'星尾'},patternType:{none:'なし',spots:'斑点',flame:'炎',stripe:'縞',star:'星'},accessory:{none:'なし',goggles:'ゴーグル',crown:'王冠',ribbon:'リボン'}};function hexRgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}function rgbHex(a){return'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}function mix(h,t,p){let a=hexRgb(h),b=hexRgb(t);return rgbHex(a.map((v,i)=>v+(b[i]-v)*p))}function setGrad(){const m=state.main,s=state.sub;document.getElementById('bodyHi').setAttribute('stop-color',mix(m,'#fff3dd',.26));document.getElementById('bodyMid').setAttribute('stop-color',m);document.getElementById('bodyLo').setAttribute('stop-color',mix(m,'#5b2435',.28));document.getElementById('subHi').setAttribute('stop-color',mix(s,'#fff0d8',.18));document.getElementById('subMid').setAttribute('stop-color',s);document.getElementById('subLo').setAttribute('stop-color',mix(s,'#40222b',.32));document.documentElement.style.setProperty('--eye',state.eye);document.documentElement.style.setProperty('--pattern',state.pattern)}function showGroup(prefix,value,vals){vals.forEach(v=>{const e=document.getElementById(prefix+v);if(e)e.style.display=v===value?'':'none'})}function render(){setGrad();showGroup('eyes-',state.expression,['normal','happy','drive']);showGroup('mouth-',state.expression==='happy'?'smile':state.expression==='drive'?'small':'smile',['smile','small','sad']);showGroup('horn-',state.horn,['small','round','long']);showGroup('wing-',state.wing,['small','round','point']);showGroup('tail-',state.tail,['normal','flame','star']);showGroup('pat-',state.patternType,['none','spots','flame','stripe','star']);showGroup('acc-',state.accessory,['none','goggles','crown','ribbon']);document.querySelectorAll('.choice[data-k]').forEach(b=>b.classList.toggle('on',state[b.dataset.k]===b.dataset.v));document.getElementById('spec').innerHTML=`<span class=chip>体色 ${state.main}</span><span class=chip>表情 ${labels.expression[state.expression]}</span><span class=chip>角 ${labels.horn[state.horn]}</span><span class=chip>羽 ${labels.wing[state.wing]}</span><span class=chip>しっぽ ${labels.tail[state.tail]}</span><span class=chip>模様 ${labels.patternType[state.patternType]}</span><span class=chip>アクセ ${labels.accessory[state.accessory]}</span>`}function colorButtons(id,key,arr){const c=document.getElementById(id);arr.forEach(x=>{const b=document.createElement('button');b.className='sw';b.style.background=x;b.onclick=()=>{state[key]=x;render()};c.appendChild(b)})}colorButtons('mainColors','main',mainPalette);colorButtons('subColors','sub',subPalette);colorButtons('eyeColors','eye',eyePalette);colorButtons('patternColors','pattern',patternPalette);const defs={expression:['normal','happy','drive'],horn:['small','round','long'],wing:['small','round','point'],tail:['normal','flame','star'],patternType:['none','spots','flame','stripe','star'],accessory:['none','goggles','crown','ribbon']};document.querySelectorAll('[data-k]').forEach(c=>{const k=c.dataset.k;defs[k].forEach(v=>{let b=document.createElement('button');b.className='choice';b.dataset.k=k;b.dataset.v=v;b.textContent=labels[k][v];b.onclick=()=>{state[k]=v;render()};c.appendChild(b)})});document.getElementById('random').onclick=()=>{state.main=mainPalette[Math.floor(Math.random()*mainPalette.length)];state.sub=subPalette[Math.floor(Math.random()*subPalette.length)];state.eye=eyePalette[Math.floor(Math.random()*eyePalette.length)];state.pattern=patternPalette[Math.floor(Math.random()*patternPalette.length)];Object.keys(defs).forEach(k=>state[k]=defs[k][Math.floor(Math.random()*defs[k].length)]);render()};document.getElementById('reset').onclick=()=>{Object.assign(state,{main:'#e57c68',sub:'#8d6673',eye:'#b9554d',pattern:'#9d6a67',expression:'normal',horn:'small',wing:'small',tail:'normal',patternType:'none',accessory:'none'});render()};render();</script></body></html>
