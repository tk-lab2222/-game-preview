<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STAR ATHLETES</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe3;font-family:system-ui,"Hiragino Maru Gothic ProN",sans-serif;color:#171717}.a{max-width:520px;margin:auto;padding:12px 12px 90px}.top{display:flex;justify-content:space-between}.logo{font-weight:900;font-size:20px}.p{background:#fffdf7;border:2px solid #222;border-radius:999px;padding:5px 8px;font-weight:800;font-size:11px}.b{background:#1d1d1d;color:#fff;border:2px solid #000;border-radius:16px;padding:10px;margin:10px 0;box-shadow:0 4px #0003}.box{background:#fffdf7;border:2px solid #222;border-radius:18px;padding:10px;margin:10px 0;box-shadow:0 4px #0003}h3{margin:0 0 8px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{border:2px solid #222;border-radius:14px;overflow:hidden;background:#fff;position:relative}.sel{outline:4px solid #ffd65a}.team{outline:4px solid #65b96e}.pic{height:92px;position:relative;overflow:hidden;background:#fff}.pic img{width:100%;height:100%;object-fit:cover}.pat{position:absolute;inset:0;opacity:.18;mix-blend-mode:multiply}.acc{position:absolute;right:5px;top:2px;font-size:22px}.bd{padding:6px}.nm{display:flex;justify-content:space-between;font-weight:900;font-size:12px}.rar{background:#222;color:#fff;border-radius:7px;padding:1px 5px;font-size:9px}.meta,.sm{font-size:9px;opacity:.7;font-weight:700}.stats{display:grid;grid-template-columns:1fr 1fr;font-size:9px}.st{display:flex;justify-content:space-between;border-bottom:1px dotted #bbb}.tags{font-size:8px;margin-top:4px}.tag{display:inline-block;border:1px solid #222;border-radius:999px;padding:1px 4px;margin:1px}.parents{display:grid;grid-template-columns:1fr 36px 1fr;gap:6px;align-items:center}.par{min-height:105px;border:2px dashed #777;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.par img{width:100%;height:70px;object-fit:cover}.x{text-align:center;font-size:24px;font-weight:900}.btn{width:100%;border:2px solid #222;border-radius:13px;background:#222;color:#fff;padding:10px;font-weight:900;box-shadow:0 3px #0004}.or{background:#ff6b35}.yl{background:#ffd65a;color:#342b00}.gn{background:#65b96e;color:#102914}.btn:disabled{opacity:.35}.egg{text-align:center;font-size:48px;padding:10px}.notice{border:2px solid #222;border-radius:12px;background:#fff4c8;padding:8px;margin-top:7px;font-size:10px;font-weight:800}.row{display:grid;grid-template-columns:54px 1fr;gap:7px;align-items:center;border:2px solid #222;border-radius:12px;padding:6px;margin:6px 0;background:#fff}.row img{width:54px;height:48px;object-fit:cover;border-radius:9px}.row select{width:100%;padding:6px;border:2px solid #222;border-radius:9px;background:#fffdf7;font-weight:800;font-size:10px}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:2px solid #222;border-radius:999px;padding:4px 6px;background:#e8f2ff;font-size:9px;font-weight:900}.evt{border:2px solid #222;border-radius:12px;padding:7px;margin:6px 0;background:#fff}.evt b{font-size:12px}.imp{font-size:9px;background:#fff3bf;border:1px solid #222;border-radius:999px;padding:2px 5px}.res{font-size:10px;font-weight:800}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffdf7;border-top:2px solid #222;padding:6px}.tab{border:0;background:transparent;font-weight:900}.active{background:#ffe9a6;border-radius:10px}.hide{display:none}</style></head><body><div class="a"><div class="top"><div><div class="logo">STAR ATHLETES</div><div class="sm">BREED → SELECT 3 → TRAIN → COMPETE</div></div><div><span class="p">🏆 <span id="w">0</span></span> <span class="p">🥚 <span id="cap">3</span></span></div></div><div class="b"><b id="goal">2体の贈り物から始めよう</b><div class="sm" style="color:#ddd">勝つほど次世代の誕生候補数が増える</div></div><section id="breed"><div class="box"><h3>配合できる仲間</h3><div id="breeders" class="grid"></div></div><div class="box"><h3>配合 <span class="sm"><span id="cnt">0</span>/<span id="mx">3</span>体</span></h3><div class="parents"><div id="pa" class="par">①親</div><div class="x">×</div><div id="pb" class="par">②親</div></div><p><button id="breedBtn" class="btn or" disabled>🥚 配合</button></p><div id="egg" class="egg">🥚</div><button id="hatch" class="btn yl" disabled>孵化する</button><div id="birth"></div></div><div id="candBox" class="box hide"><h3>この世代から3体を引き取る</h3><div id="cands" class="grid"></div><p><button id="adopt" class="btn gn" disabled>この3体をネストへ</button></p><div class="sm">残りは里親のもとへ旅立ち、図鑑に記録されます。</div></div></section><section id="train" class="hide"><div class="box"><h3>次の大会</h3><div id="sched" class="chips"></div></div><div class="box"><h3>個別トレーニング <span class="sm"><span id="turn">0</span>/3</span></h3><div id="plans"></div><button id="doTrain" class="btn or">練習する</button><div id="gain"></div></div><div class="box"><h3>出場者・作戦</h3><div id="prep"></div><button id="toMeet" class="btn yl" disabled>大会へ</button></div></section><section id="meet" class="hide"><div class="box"><h3>運動会</h3><div id="rival"></div><div id="events"></div><button id="run" class="btn gn">大会スタート</button><div id="result"></div><p><button id="next" class="btn yl hide">次世代へ</button></p></div></section><section id="dex" class="hide"><div class="box"><h3>図鑑</h3><div>誕生 <b id="db">0</b> / 引取 <b id="da">0</b> / 里親 <b id="df">0</b> / ライバル再会 <b id="dr">0</b></div><hr><div id="fl" class="sm"></div></div></section></div><div class="tabs"><button class="tab active" data-v="breed">🥚<br>配合</button><button class="tab" data-v="train">🏋️<br>育成</button><button class="tab" data-v="meet">🏆<br>大会</button><button class="tab" data-v="dex">📖<br>図鑑</button></div><script>const A={draco:'assets/draco.jpg',unil:'assets/unil.jpg',grimo:'assets/grimo.jpg',puru:'assets/puru.jpg'},SP={draco:['ドラコ族',{power:18,guts:14,stamina:8}],unil:['ユニル族',{speed:18,agility:14,tech:7}],grimo:['グリモ族',{tech:18,agility:14,speed:5}],puru:['ぷるもん族',{stamina:16,tech:8}]},SL={power:'ちから',speed:'スピード',stamina:'スタミナ',agility:'すばやさ',tech:'テクニック',guts:'こんじょう'},R=['C','U','R','SR','SSR','UR','EX'],COL=['赤','青','緑','白','黒','黄','金'],PAT=['なし','ストライプ','スポット','炎','雷','星'],ACC=['なし','リボン','ゴーグル','鉢巻','ベル','スター'],PART={draco:['小角','二本角','丸角','星角'],unil:['短角','長角','螺旋角','星角'],grimo:['小羽','丸羽','長羽','星羽'],puru:['丸耳','しずく耳','星耳','ふわ耳']},P=['熱血','冷静','負けず嫌い','お調子者','臆病','マイペース'];let S={starters:[],nest:[],cands:[],parents:[],egg:null,sel:[],wins:0,turn:0,foster:[],dex:{b:0,a:0,f:0,r:0},schedule:[],plans:{},assign:{},strat:{}};const $=x=>document.getElementById(x),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,cap=()=>Math.min(12,3+S.wins),ri=x=>R.indexOf(x);function vg(s){return{color:COL[rnd(0,6)],pattern:PAT[rnd(0,5)],acc:ACC[rnd(0,5)],part:PART[s][rnd(0,3)]}}function style(v){let h={赤:0,青:190,緑:105,白:0,黒:0,黄:45,金:35}[v.color]||0,sa=v.color==='白'?.2:1,br=v.color==='黒'?.7:1;return`filter:hue-rotate(${h}deg) saturate(${sa}) brightness(${br})`}function pst(p){return p==='ストライプ'?'background:repeating-linear-gradient(135deg,transparent 0 12px,#222 12px 16px)':p==='スポット'?'background:radial-gradient(circle,#222 0 4px,transparent 5px) 0 0/30px 30px':p==='炎'?'background:linear-gradient(135deg,transparent 50%,#f63 51%)':p==='雷'?'background:repeating-linear-gradient(65deg,transparent 0 18px,#fc5 19px 23px)':p==='星'?'background:radial-gradient(circle,#fc5 0 4px,transparent 5px) 0 0/32px 32px':''}function ae(a){return{なし:'',リボン:'🎀',ゴーグル:'🥽',鉢巻:'🎗️',ベル:'🔔',スター:'⭐'}[a]}function starter(s,n){let st={};for(let k in SL)st[k]=90+rnd(-8,8)+(SP[s][1][k]||0);return{id:crypto.randomUUID(),name:n,species:s,rarity:'C',gen:0,stats:st,growth:'B',luck:rnd(30,75),personality:P[rnd(0,5)],visual:vg(s),origin:'プレゼント',rivalCount:0}}function baby(a,b){let sp=Math.random()<.49?a.species:b.species,rar=R[Math.max(0,Math.min(6,Math.round((ri(a.rarity)+ri(b.rarity))/2)+(Math.random()<.16?1:0)))],st={},inh=[];for(let k in SL){let av=(a.stats[k]+b.stats[k])/2,hi=Math.max(a.stats[k],b.stats[k]);st[k]=Math.round(av*.78+hi*.22+rnd(-8,10)+(SP[sp][1][k]||0)*.2+ri(rar)*4);if(Math.abs(a.stats[k]-b.stats[k])>12)inh.push((a.stats[k]>b.stats[k]?a.name:b.name)+'→'+SL[k])}let v={},mut=[];for(let k of ['color','pattern','acc','part']){let x=Math.random()<.48?a.visual[k]:Math.random()<.96?b.visual[k]:null;if(!x){x=vg(sp)[k];mut.push(k)}v[k]=x}let names={draco:['ラゴ','カイ','ルド'],unil:['ミラ','ルナ','リリ'],grimo:['グレン','クウ','ノア'],puru:['ぷる','もち','ぽよ']};return{id:crypto.randomUUID(),name:names[sp][rnd(0,2)]+rnd(1,99),species:sp,rarity:rar,gen:Math.max(a.gen,b.gen)+1,stats:st,growth:['C','B','B','A','S'][rnd(0,4)],luck:rnd(1,100),personality:P[rnd(0,5)],visual:v,vm:mut,origin:a.name+'×'+b.name,inh:inh.slice(0,2),rivalCount:0}}function pic(m){return`<div class="pic"><img src="${A[m.species]}" style="${style(m.visual)}"><div class="pat" style="${pst(m.visual.pattern)}"></div><div class="acc">${ae(m.visual.acc)}</div></div>`}function card(m,mode){let c=(mode==='p'&&S.parents.includes(m.id))?' sel':(mode==='c'&&S.sel.includes(m.id))?' team':'';return`<div class="card${c}" data-id="${m.id}" data-m="${mode}">${pic(m)}<div class="bd"><div class="nm"><span>${m.name}</span><span class="rar">${m.rarity}</span></div><div class="meta">${SP[m.species][0]} G${m.gen} ${m.personality}</div><div class="stats">${Object.entries(m.stats).map(([k,v])=>`<div class="st"><span>${SL[k]}</span><b>${v}</b></div>`).join('')}</div><div class="tags"><span class="tag">${m.visual.color}</span><span class="tag">${m.visual.pattern}</span><span class="tag">${m.visual.part}</span><span class="tag">${m.visual.acc}</span></div></div></div>`}function breeders(){return[...S.starters,...S.nest]}function sched(){let a=['50m走','障害物競走','大玉ころがし','坂道かけあがり','10000m走','的当て'].sort(()=>Math.random()-.5).slice(0,3);a.push(Math.random()<.5?'リレー':'綱引き');S.schedule=a}const INF={'50m走':['スピード・すばやさ','speed'],障害物競走:['テクニック・すばやさ','tech'],大玉ころがし:['ちから・スタミナ','power'],坂道かけあがり:['ちから・スタミナ・こんじょう','stamina'],'10000m走':['スタミナ・こんじょう','stamina'],的当て:['テクニック・ちから','tech'],リレー:['スピード・テクニック・連携','speed'],綱引き:['ちから・スタミナ・連携','power']};function score(m,e){let s=m.stats;return e==='50m走'?s.speed*.5+s.agility*.3+s.tech*.2:e==='障害物競走'?s.tech*.4+s.agility*.35+s.speed*.15+s.guts*.1:e==='大玉ころがし'?s.power*.48+s.stamina*.3+s.guts*.22:e==='坂道かけあがり'?s.power*.35+s.stamina*.35+s.guts*.3:e==='10000m走'?s.stamina*.45+s.guts*.3+s.speed*.15+s.tech*.1:e==='的当て'?s.tech*.55+s.power*.2+s.agility*.15+s.guts*.1:e==='リレー'?s.speed*.45+s.tech*.2+s.agility*.2+s.guts*.15:s.power*.45+s.stamina*.3+s.guts*.25}function best(e){return[...S.nest].sort((a,b)=>score(b,e)-score(a,e))[0]}function render(){w.textContent=S.wins;cap.textContent=mx.textContent=cap();cnt.textContent=S.cands.length;breeders.innerHTML=breeders().map(m=>card(m,'p')).join('');cands.innerHTML=S.cands.map(m=>card(m,'c')).join('');document.querySelectorAll('.card').forEach(x=>x.onclick=()=>x.dataset.m==='p'?pickP(x.dataset.id):pickC(x.dataset.id));breedBtn.disabled=S.parents.length!==2||!!S.egg||S.cands.length>=cap();hatch.disabled=!S.egg;candBox.classList.toggle('hide',S.cands.length<cap());adopt.disabled=S.sel.length!==3;turn.textContent=S.turn;toMeet.disabled=S.turn<3;db.textContent=S.dex.b;da.textContent=S.dex.a;df.textContent=S.dex.f;dr.textContent=S.dex.r;fl.innerHTML=S.foster.length?S.foster.slice(-8).reverse().map(m=>`${m.name} ${m.rarity} 再会${m.rivalCount}回`).join('<br>'):'まだいません';renderParents();renderTrain()}function renderParents(){[pa,pb].forEach((e,i)=>{let m=breeders().find(x=>x.id===S.parents[i]);e.innerHTML=m?`${pic(m)}<b>${m.name}/${m.rarity}</b>`:(i?'②親':'①親')})}function pickP(id){S.parents.includes(id)?S.parents=S.parents.filter(x=>x!==id):S.parents.length<2?S.parents.push(id):S.parents=[S.parents[1],id];render()}function pickC(id){S.sel.includes(id)?S.sel=S.sel.filter(x=>x!==id):S.sel.length<3&&S.sel.push(id);render()}breedBtn.onclick=()=>{let[a,b]=S.parents.map(id=>breeders().find(x=>x.id===id));S.egg=baby(a,b);hatch.disabled=false;egg.textContent='🥚'};hatch.onclick=()=>{let b=S.egg;S.cands.push(b);S.dex.b++;S.egg=null;birth.innerHTML=`<div class="notice"><b>${b.name}/${b.rarity}</b><br>${b.origin}<br>${b.inh?.join(' / ')||'両親の素質を継承'}<br>見た目：${b.visual.color}/${b.visual.pattern}/${b.visual.part}/${b.visual.acc}${b.vm.length?'<br>★見た目変異！':''}</div>`;S.parents=[];render()};adopt.onclick=()=>{let ch=S.cands.filter(m=>S.sel.includes(m.id)),lv=S.cands.filter(m=>!S.sel.includes(m.id));lv.forEach(m=>S.foster.push(m));S.dex.f+=lv.length;S.dex.a+=3;S.nest=ch;S.cands=[];S.sel=[];S.parents=[];S.turn=0;S.plans={};S.assign={};S.strat={};sched();show('train');render()};function renderTrain(){if(!S.nest.length||!S.schedule.length)return;sched.innerHTML=S.schedule.map(e=>`<span class="chip">${e}<br>${INF[e][0]}</span>`).join('');plans.innerHTML=S.nest.map(m=>{let r=INF[S.schedule[0]][1],c=S.plans[m.id]||r;return`<div class="row"><img src="${A[m.species]}"><div><b>${m.name}</b><select data-p="${m.id}">${['speed','power','tech','stamina','team'].map(x=>`<option value="${x}" ${x===c?'selected':''}>${{speed:'走り込み',power:'パワー',tech:'技術',stamina:'持久',team:'連携'}[x]}</option>`).join('')}</select></div></div>`}).join('');document.querySelectorAll('[data-p]').forEach(x=>x.onchange=()=>S.plans[x.dataset.p]=x.value);prep.innerHTML=S.schedule.map((e,i)=>{let b=best(e);S.assign[i]??=b.id;S.strat[i]??='バランス';return`<div class="evt"><b>${e}</b> <span class="imp">重要:${INF[e][0]}</span><div class="sm">おすすめ:${b.name}</div><select data-a="${i}">${S.nest.map(m=>`<option value="${m.id}" ${m.id===S.assign[i]?'selected':''}>${m.name}</option>`).join('')}</select> <select data-s="${i}">${['先行','バランス','温存','追込'].map(z=>`<option ${z===S.strat[i]?'selected':''}>${z}</option>`).join('')}</select></div>`}).join('');document.querySelectorAll('[data-a]').forEach(x=>x.onchange=()=>S.assign[x.dataset.a]=x.value);document.querySelectorAll('[data-s]').forEach(x=>x.onchange=()=>S.strat[x.dataset.s]=x.value)}doTrain.onclick=()=>{let boost={speed:[['speed',12],['agility',7]],power:[['power',12],['guts',7]],tech:[['tech',12],['agility',6]],stamina:[['stamina',12],['guts',6]],team:[['guts',7],['tech',7]]},out=[];S.nest.forEach(m=>{let t=S.plans[m.id]||'speed',r=Math.random(),g=r<.02?'超成功':r<.15?'大成功':'成功',mul=g==='超成功'?2:g==='大成功'?1.5:1,up=[];boost[t].forEach(([k,v])=>{let n=Math.round(v*mul+rnd(-1,3));m.stats[k]+=n;up.push(`${SL[k]}+${n}`)});out.push(`${m.name}：${g} ${up.join(' / ')}`)});S.turn++;gain.innerHTML='<div class="notice">'+out.join('<br>')+'</div>';render()};toMeet.onclick=()=>{prepareRival();events.innerHTML=S.schedule.map((e,i)=>`<div class="evt"><b>${e}</b><div class="sm">${S.nest.find(m=>m.id===S.assign[i])?.name||best(e).name} / ${S.strat[i]}</div></div>`).join('');show('meet')};function prepareRival(){S.rival=null;if(S.foster.length&&Math.random()<.35){let src=S.foster[rnd(0,S.foster.length-1)];S.rival=JSON.parse(JSON.stringify(src));Object.keys(S.rival.stats).forEach((k,i)=>S.rival.stats[k]+=i<3?28+S.wins*5:rnd(4,12));src.rivalCount++;S.dex.r++;rival.innerHTML=`<div class="notice">再会！ <b>${src.name}</b> が別ネスト代表として出場。</div>`}else rival.innerHTML=''}run.onclick=()=>{let pts=0,rs=[];S.schedule.forEach((e,i)=>{let m=S.nest.find(x=>x.id===S.assign[i])||best(e),st=S.strat[i],sm=st==='先行'?1.02:st==='追込'?1.03:st==='温存'?1.02:1,ps=score(m,e)*sm*(.94+Math.random()*.12),op=Array.from({length:7},()=>95+S.wins*5+Math.random()*70);if(S.rival)op[0]=score(S.rival,e);let rank=1+op.filter(x=>x>ps).length;pts+=[0,8,6,5,4,3,2,1,0][rank];rs.push(`${e}：${rank}位`)});let o=pts>=25?1:pts>=20?2:pts>=16?3:4;if(o===1)S.wins++;result.innerHTML=`<div class="notice">${rs.join('<br>')}<br><b>総合${o}位</b>${o===1?'<br>★次世代の候補枠+1':''}</div>`;run.classList.add('hide');next.classList.remove('hide');render()};next.onclick=()=>{S.parents=[];S.cands=[];S.sel=[];S.egg=null;S.turn=0;S.schedule=[];S.plans={};S.assign={};S.strat={};run.classList.remove('hide');next.classList.add('hide');result.innerHTML='';show('breed');render()};function show(id){['breed','train','meet','dex'].forEach(x=>$(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===id))}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.v));S.starters=[starter('draco','ラゴ'),starter('unil','ミラ')];render();</script></body></html>
