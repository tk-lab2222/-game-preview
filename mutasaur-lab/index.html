<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>MUTASAUR LAB - Prototype</title>
<style>
:root{--bg:#f4efe3;--ink:#171717;--paper:#fffdf7;--accent:#ff6b35;--green:#65b96e;--yellow:#ffd65a;--blue:#66a9ff;--pink:#ff8fb3;--shadow:0 5px 0 rgba(0,0,0,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.8),transparent 25%),linear-gradient(#f6f1e6,#eae1cf);color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 12px calc(88px + env(safe-area-inset-bottom))}.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 6px;gap:8px}.logo{font-weight:1000;font-size:20px;letter-spacing:-.7px}.sub{font-size:10px;opacity:.55;font-weight:800}.res{display:flex;gap:6px}.pill{background:var(--paper);border:2px solid #222;border-radius:999px;padding:5px 9px;font-weight:900;font-size:12px;box-shadow:0 3px 0 #2222}.panel{background:rgba(255,253,247,.92);border:2.5px solid #222;border-radius:22px;margin:10px 0;padding:12px;box-shadow:var(--shadow)}.section-title{font-weight:1000;font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.small{font-size:11px;opacity:.6;font-weight:800}.breeding{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;gap:6px}.parent-slot{min-height:155px;border:2px dashed #777;border-radius:18px;background:#fffaf0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;position:relative}.parent-slot.ready{border-style:solid;border-color:#222}.cross{font-size:30px;font-weight:1000;text-align:center}.dino-portrait{font-size:68px;line-height:1;filter:drop-shadow(0 4px 0 #0002)}.dino-name{font-weight:1000;font-size:13px;margin-top:4px}.dino-meta{font-size:10px;font-weight:900;opacity:.65}.traits{display:flex;justify-content:center;gap:3px;margin-top:5px;flex-wrap:wrap}.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid #222;display:inline-block}.btn{width:100%;border:2.5px solid #222;border-radius:16px;background:#222;color:white;font-weight:1000;font-size:15px;padding:13px 12px;box-shadow:0 4px 0 #0004;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0004}.btn.orange{background:var(--accent)}.btn.green{background:var(--green);color:#102914}.btn.yellow{background:var(--yellow);color:#3a2d00}.btn:disabled{opacity:.35;filter:grayscale(1)}.eggbox{margin-top:10px;border-radius:18px;border:2px solid #222;background:#ece5d6;min-height:110px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.egg{font-size:66px;animation:bob 1.1s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-7px) rotate(3deg)}}.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:#fff;border:2px solid #222;border-radius:18px;padding:8px;position:relative;box-shadow:0 3px 0 #0002}.card.selected{outline:4px solid #ffd65a}.card .dino-portrait{font-size:48px}.cardhead{display:flex;gap:6px;align-items:center}.level{position:absolute;right:7px;top:7px;background:#222;color:#fff;border-radius:9px;padding:3px 6px;font-size:10px;font-weight:1000}.stat{font-size:10px;font-weight:900;margin-top:4px}.bar{height:7px;border:1.5px solid #222;border-radius:9px;overflow:hidden;background:#eee}.fill{height:100%;background:#222}.mutant{position:absolute;left:7px;top:7px;background:#ff6b35;color:#fff;border:2px solid #222;border-radius:8px;padding:2px 5px;font-size:9px;font-weight:1000;transform:rotate(-4deg)}.hunt-stage{height:180px;position:relative;border:2px solid #222;border-radius:18px;overflow:hidden;background:linear-gradient(#cfe9ff 0 56%,#d9c38e 56%);margin-bottom:8px}.enemy{position:absolute;right:28px;bottom:23px;font-size:70px;transform:scaleX(-1)}.hunter{position:absolute;left:25px;bottom:24px;font-size:58px;transition:.35s}.hunter.attack{transform:translateX(190px) rotate(-8deg)}.damage{position:absolute;font-weight:1000;font-size:28px;color:#d92727;right:95px;bottom:95px;opacity:0}.damage.show{animation:dmg .6s}@keyframes dmg{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-35px)}}.enemyhp{position:absolute;right:12px;top:10px;width:160px}.log{font-size:12px;min-height:34px;font-weight:800;background:#fff;border:2px solid #222;border-radius:12px;padding:8px}.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fffdf7;border-top:2.5px solid #222;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20}.tab{border:0;background:transparent;padding:6px 2px;font-weight:1000;font-size:11px}.tab span{display:block;font-size:24px}.tab.active{background:#ffe9a6;border-radius:14px}.view{display:none}.view.active{display:block}.banner{background:#1d1d1d;color:#fff;border-radius:17px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;border:2px solid #000;box-shadow:var(--shadow)}.banner b{font-size:15px}.banner em{color:#ffd65a;font-style:normal}.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-20px);background:#222;color:#fff;padding:9px 13px;border-radius:999px;font-weight:900;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.help{font-size:11px;line-height:1.55;font-weight:700;opacity:.75}
</style></head><body><div class="app"><div class="topbar"><div><div class="logo">MUTASAUR LAB</div><div class="sub">BREED → MUTATE → HUNT</div></div><div class="res"><div class="pill">🍖 <span id="food">40</span></div><div class="pill">🦴 <span id="bones">0</span></div></div></div><div class="banner"><div><b>研究目標</b><div class="small" style="color:#ddd">突然変異個体を生み出せ</div></div><div><em id="mutationCount">0</em> / 5</div></div><section id="lab" class="view active"><div class="panel"><div class="section-title">スターター恐竜 <span class="small">まず2体タップ</span></div><div id="roster" class="roster"></div></div><div class="panel"><div class="section-title">交配ラボ <span class="small">親を2体選択</span></div><div class="breeding"><div id="parentA" class="parent-slot">① 恐竜を<br>タップ</div><div class="cross">×</div><div id="parentB" class="parent-slot">② もう1体<br>タップ</div></div><div style="height:8px"></div><button class="btn orange" id="breedBtn" disabled>🥚 交配する（🍖 6）</button><div class="eggbox" id="eggBox"><div class="small">ここに卵が生まれる</div></div><div style="height:8px"></div><button class="btn yellow" id="hatchBtn" disabled>孵化する</button></div></section><section id="hunt" class="view"><div class="panel"><div class="section-title">ハンティング</div><div class="hunt-stage"><div class="enemyhp"><div class="small">WILD TRICERA Lv.<span id="enemyLv">4</span></div><div class="bar"><div id="enemyHpBar" class="fill" style="width:100%"></div></div></div><div id="hunter" class="hunter">🦖</div><div class="enemy">🦕</div><div id="damage" class="damage">-12</div></div><div id="huntLog" class="log">出撃する恐竜をラボで最後に選んでね。</div><div style="height:8px"></div><button class="btn green" id="attackBtn">⚔️ 狩る</button></div><div class="panel"><div class="section-title">現在のハンター</div><div id="hunterCard" class="help">未選択</div></div></section><section id="guide" class="view"><div class="panel"><div class="section-title">遊び方</div><div class="help">① 恐竜を2体選ぶ → ② 交配 → ③ 孵化 → ④ 強い子を親に戻す。子は見た目と能力を親から継承し、低確率で突然変異します。</div></div></section></div><div class="tabs"><button class="tab active" data-view="lab"><span>🥚</span>交配</button><button class="tab" data-view="hunt"><span>⚔️</span>狩り</button><button class="tab" data-view="guide"><span>📖</span>説明</button></div><div id="toast" class="toast"></div><script>
const COLORS=['#65b96e','#ff8f70','#65a8ff','#c789e8','#ffd65a','#8bd7c7'];const PATTERNS=['なし','ストライプ','スポット','背中線','ギザギザ'];const CRESTS=['なし','小角','二本角','トサカ','背びれ'];const NAMES=['Rex','Nova','Moss','Bolt','Luna','Spike','Amber','Echo','Fang','Milo','Kira','Riot'];let state={food:40,bones:0,nextId:4,egg:null,selected:[],lastSelected:null,mutations:0,dinos:[{id:1,name:'Rex',lv:2,atk:11,hp:30,color:COLORS[0],pattern:'ストライプ',crest:'小角',mutant:false,gen:1},{id:2,name:'Nova',lv:2,atk:9,hp:36,color:COLORS[2],pattern:'スポット',crest:'トサカ',mutant:false,gen:1},{id:3,name:'Amber',lv:1,atk:8,hp:28,color:COLORS[4],pattern:'背中線',crest:'なし',mutant:false,gen:1}],enemy:{lv:4,hp:45,maxHp:45}};const $=s=>document.querySelector(s),rand=a=>a[Math.floor(Math.random()*a.length)],pick=(a,b)=>Math.random()<.5?a:b;const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200)};function dinoEmoji(d){return d.crest==='トサカ'?'🦕':'🦖'}function cardHTML(d,c=false){return `<div class="${c?'':'card'}" ${c?'':'data-id="'+d.id+'"'}>${d.mutant?'<div class="mutant">MUTANT</div>':''}${c?'':'<div class="level">Lv.'+d.lv+'</div>'}<div class="cardhead"><div class="dino-portrait">${dinoEmoji(d)}</div><div><div class="dino-name">${d.name}</div><div class="dino-meta">G${d.gen} / ${d.pattern} / ${d.crest}</div><div class="traits"><span class="dot" style="background:${d.color}"></span><span class="dot" style="background:${d.mutant?'#ff6b35':'#ddd'}"></span></div></div></div>${c?'':`<div class="stat">ATK ${d.atk}<div class="bar"><div class="fill" style="width:${Math.min(100,d.atk*4)}%"></div></div></div><div class="stat">HP ${d.hp}<div class="bar"><div class="fill" style="width:${Math.min(100,d.hp*2)}%"></div></div></div>`}</div>`}function render(){['food','bones','mutationCount'].forEach(k=>$('#'+k).textContent=state[k==='mutationCount'?'mutations':k]);$('#roster').innerHTML=state.dinos.map(d=>cardHTML(d)).join('');state.dinos.forEach(d=>{const e=document.querySelector(`.card[data-id="${d.id}"]`);if(state.selected.includes(d.id))e.classList.add('selected');e.onclick=()=>selectDino(d.id)});renderParents();$('#breedBtn').disabled=state.selected.length!==2||!!state.egg||state.food<6;$('#hatchBtn').disabled=!state.egg;$('#hunterCard').innerHTML=state.lastSelected?cardHTML(state.dinos.find(d=>d.id===state.lastSelected),true):'未選択'}function renderParents(){['parentA','parentB'].forEach((s,i)=>{const id=state.selected[i],e=$('#'+s);if(!id){e.className='parent-slot';e.innerHTML=`${i?'② もう1体':'① 恐竜を'}<br>タップ`;return}const d=state.dinos.find(x=>x.id===id);e.className='parent-slot ready';e.innerHTML=cardHTML(d,true)})}function selectDino(id){state.lastSelected=id;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(state.selected.length<2)state.selected.push(id);else state.selected=[state.selected[1],id];render()}function makeBaby(a,b){let m=Math.random()<.22,color=pick(a.color,b.color),pattern=pick(a.pattern,b.pattern),crest=pick(a.crest,b.crest),atk=Math.round((a.atk+b.atk)/2),hp=Math.round((a.hp+b.hp)/2),lv=Math.max(1,Math.round((a.lv+b.lv)/2));if(m){color=Math.random()<.5?rand(COLORS):color;pattern=Math.random()<.5?rand(PATTERNS):pattern;crest=Math.random()<.5?rand(CRESTS):crest;atk=Math.round(atk*(1.18+Math.random()*.28));hp=Math.round(hp*(1.18+Math.random()*.28))}return{id:state.nextId++,name:rand(NAMES),lv,atk,hp,color,pattern,crest,mutant:m,gen:Math.max(a.gen,b.gen)+1}}$('#breedBtn').onclick=()=>{const[a,b]=state.selected.map(id=>state.dinos.find(d=>d.id===id));state.food-=6;state.egg=makeBaby(a,b);$('#eggBox').innerHTML='<div class="egg">🥚</div>';toast('卵が生まれた！');render()};$('#hatchBtn').onclick=()=>{const b=state.egg;if(!b)return;state.egg=null;state.dinos.push(b);if(b.mutant){state.mutations++;toast('⚡ 突然変異！！')}else toast('新しい子が孵化！');$('#eggBox').innerHTML='<div class="small">ここに卵が生まれる</div>';state.selected=[];state.lastSelected=b.id;render()};$('#attackBtn').onclick=()=>{const d=state.dinos.find(x=>x.id===state.lastSelected);if(!d)return toast('恐竜を選んでね');let dmg=Math.max(2,Math.round(d.atk*(.75+Math.random()*.55)));state.enemy.hp-=dmg;$('#damage').textContent='-'+dmg;$('#damage').classList.remove('show');void $('#damage').offsetWidth;$('#damage').classList.add('show');$('#enemyHpBar').style.width=Math.max(0,state.enemy.hp/state.enemy.maxHp*100)+'%';if(state.enemy.hp<=0){state.food+=7;state.bones+=2;state.enemy.hp=state.enemy.maxHp;$('#enemyHpBar').style.width='100%';$('#huntLog').textContent='勝利！ 🍖+7 / 🦴+2';render()}else $('#huntLog').textContent=`${d.name} が ${dmg} ダメージ！`};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+t.dataset.view).classList.add('active');render()});render();
</script></body></html>
